<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ciela's World of Learning</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E7C86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ciela's World">
<link rel="apple-touch-icon" href="appIcon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#8FD8EA;
  --horizon:#F7E3B6;
  --teal:#0E7C86;
  --teal-deep:#0A5A62;
  --gold:#E8B75A;
  --gold-light:#FBE39B;
  --navy:#153349;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}

body{
  font-family:'Nunito',system-ui,sans-serif;
  background:linear-gradient(180deg,var(--sky) 0%,#BFE7E4 45%,var(--horizon) 100%);
  color:var(--navy);
  user-select:none;-webkit-user-select:none;
}

/* ---------- stage ---------- */

.stage{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

.stage::before{
  content:'';position:absolute;inset:0;
  background-image:url('backgroundPlate.png');
  background-size:cover;background-position:center;
  opacity:0;transition:opacity .6s ease;z-index:0;
}
.stage.has-bg::before{opacity:1}

/* ---------- header ---------- */

.bar{
  position:relative;z-index:3;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) 14px 6px;
}

.bar-left{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.bar-right{display:flex;align-items:center;gap:9px;min-width:0}

.mark{height:clamp(26px,6vw,44px);width:auto;filter:drop-shadow(0 2px 6px rgba(10,60,70,.35))}
.mark[hidden]{display:none}

.chip{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  width:clamp(34px,8vw,44px);height:clamp(34px,8vw,44px);
  border:0;border-radius:50%;
  background:rgba(255,255,255,.8);
  box-shadow:0 3px 10px rgba(12,70,80,.28),inset 0 0 0 2px var(--gold);
  font-size:clamp(15px,3.8vw,20px);line-height:1;cursor:pointer;
  transition:transform .18s ease,opacity .18s ease;
}
.chip:hover,.chip:focus-visible{transform:scale(1.08)}
.chip:focus-visible{outline:3px solid #fff;outline-offset:3px}
.chip[aria-pressed="true"]{opacity:.55}

.gems{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0}

.gem{
  width:clamp(11px,2.8vw,18px);height:clamp(11px,2.8vw,18px);
  border-radius:3px;background:rgba(255,255,255,.28);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);
  transform:rotate(45deg);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .35s ease;
}
.gem.won{
  background:linear-gradient(140deg,var(--gold-light),var(--gold));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85),0 0 12px rgba(232,183,90,.75);
  transform:rotate(45deg) scale(1.12);
}

/* ---------- prompt ---------- */

.prompt{
  position:relative;z-index:3;align-self:center;
  display:flex;align-items:center;gap:10px;
  margin-top:2px;padding:8px 24px;border-radius:999px;
  background:rgba(255,255,255,.84);backdrop-filter:blur(6px);
  box-shadow:0 4px 18px rgba(12,70,80,.22),inset 0 0 0 2px rgba(232,183,90,.55);
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(16px,4.3vw,28px);line-height:1.15;white-space:nowrap;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.prompt:empty{display:none}
.prompt em{font-style:normal;color:var(--teal);font-weight:800}
.prompt.pulse{transform:scale(1.06)}
.prompt img{height:clamp(28px,7vw,46px);width:auto}

/* ---------- play field ---------- */

.field{position:relative;z-index:2;flex:1;min-height:0;overflow:hidden}

.pick{
  position:absolute;transform:translate(-50%,-50%);
  border:0;background:none;padding:6px;cursor:pointer;
  animation:drift var(--dur) ease-in-out var(--delay) infinite alternate;
  touch-action:manipulation;transition:opacity .25s ease;
  line-height:.86;
}
.pick:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:18px}

@keyframes drift{
  from{transform:translate(-50%,-50%) translateY(-9px) rotate(var(--tilt))}
  to  {transform:translate(-50%,-50%) translateY(11px) rotate(calc(var(--tilt) * -1))}
}

.glyph{
  font-family:'Baloo 2',cursive;font-weight:800;font-size:var(--size);
  color:transparent;
  background-image:linear-gradient(165deg,#FFFFFF 0%,#BFF0F4 26%,var(--teal) 62%,var(--teal-deep) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:clamp(2px,.7vw,4px) var(--gold);
  paint-order:stroke fill;
  filter:drop-shadow(0 6px 10px rgba(9,60,70,.4));
}

.pick svg{display:block;width:var(--size);height:var(--size);filter:drop-shadow(0 6px 10px rgba(9,60,70,.4))}
.pick img{display:block;width:var(--size);height:auto;filter:drop-shadow(0 6px 10px rgba(9,60,70,.4))}

.pick.correct{animation:pop .55s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(1)}
  45%{transform:translate(-50%,-50%) scale(1.34) rotate(4deg)}
  100%{transform:translate(-50%,-50%) scale(0) rotate(-10deg);opacity:0}
}

.pick.wrong{animation:wobble .5s ease}
@keyframes wobble{
  0%,100%{transform:translate(-50%,-50%) rotate(0)}
  20%{transform:translate(-50%,-50%) rotate(-9deg)}
  45%{transform:translate(-50%,-50%) rotate(8deg)}
  70%{transform:translate(-50%,-50%) rotate(-5deg)}
}
.pick.faded{opacity:.42}
.field.locked .pick{pointer-events:none}

/* ---------- counting layout ---------- */

.count-wrap{position:absolute;inset:0;display:flex;flex-direction:column;gap:4px;padding:4px 10px}

.count-tray{
  flex:1;min-height:0;
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
  gap:clamp(4px,1.6vw,16px);
}
.count-tray img{
  width:var(--item);height:auto;
  filter:drop-shadow(0 5px 9px rgba(9,60,70,.4));
  animation:bobble var(--dur) ease-in-out var(--delay) infinite alternate;
}
@keyframes bobble{
  from{transform:translateY(-5px) rotate(-2deg)}
  to{transform:translateY(6px) rotate(2deg)}
}

.count-row{
  flex:0 0 auto;
  display:flex;justify-content:center;align-items:center;
  gap:clamp(10px,4vw,34px);padding-bottom:4px;
}
.count-row .pick{position:static;transform:none;animation:none}
.count-row .pick.correct{animation:popStatic .55s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes popStatic{
  0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}
}
.count-row .pick.wrong{animation:wobbleStatic .5s ease}
@keyframes wobbleStatic{
  0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}
}

/* ---------- sparkles ---------- */

.spark{
  position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:2px;
  background:linear-gradient(140deg,#fff,var(--gold));
  transform:rotate(45deg);pointer-events:none;
  animation:fly .75s ease-out forwards;
}
@keyframes fly{
  0%{opacity:1;transform:rotate(45deg) translate(0,0) scale(1)}
  100%{opacity:0;transform:rotate(220deg) translate(var(--dx),var(--dy)) scale(.2)}
}

/* ---------- crew ---------- */

.crew{
  position:relative;z-index:3;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 12px max(8px,env(safe-area-inset-bottom));pointer-events:none;
}

.teacher{
  pointer-events:auto;position:relative;border:0;background:none;padding:0;
  cursor:pointer;line-height:0;transform-origin:bottom center;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.teacher:hover,.teacher:focus-visible{transform:scale(1.04)}
.teacher:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:22px}

.ciela{height:clamp(88px,22vh,210px);width:auto;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(9,60,70,.35));display:block}
.ciela[hidden]{display:none}

.speaker{
  position:absolute;top:2px;right:-6px;
  display:flex;align-items:center;justify-content:center;
  width:clamp(28px,7vw,42px);height:clamp(28px,7vw,42px);border-radius:50%;
  background:rgba(255,255,255,.9);
  box-shadow:0 3px 10px rgba(12,70,80,.3),inset 0 0 0 2.5px var(--gold);
  font-size:clamp(13px,3.4vw,20px);line-height:1;
}

.pup{height:clamp(52px,13vh,112px);width:auto;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(9,60,70,.32));transform-origin:bottom center}
.pup[hidden]{display:none}

.teacher.cheer,.pup.cheer{animation:hop .65s cubic-bezier(.34,1.56,.64,1) 2}
.teacher.nudge,.pup.nudge{animation:sway .5s ease}
@keyframes hop{
  0%,100%{transform:translateY(0) rotate(0)}
  40%{transform:translateY(-16px) rotate(-4deg)}
  70%{transform:translateY(-4px) rotate(3deg)}
}
@keyframes sway{
  0%,100%{transform:rotate(0)}35%{transform:rotate(-5deg)}70%{transform:rotate(4deg)}
}

/* ---------- overlays ---------- */

.veil{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(12px,3vh,26px);
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  text-align:center;
  background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.5),rgba(14,124,134,.74));
  backdrop-filter:blur(3px);
  transition:opacity .45s ease,visibility .45s;
  overflow-y:auto;
}
.veil[hidden]{opacity:0;visibility:hidden;display:flex;pointer-events:none}

/* an opaque screen - nothing from the last game shows through blurred */
.veil.solid{
  background:linear-gradient(180deg,#8FD8EA 0%,#BFE7E4 46%,#F7E3B6 100%);
  backdrop-filter:none;
}
.veil.solid::before{
  content:'';position:absolute;inset:0;
  background-image:url('backgroundPlate.png');
  background-size:cover;background-position:center;
  opacity:.5;pointer-events:none;
}
.veil.solid > *{position:relative;z-index:1}

/* Ciela and Chispa stand at the edges of the home screen */
.crew-fig{
  position:absolute;bottom:0;z-index:0;
  height:min(46vh,420px);width:auto;
  filter:drop-shadow(0 10px 18px rgba(9,60,70,.35));
  pointer-events:none;
}
.ciela-fig{left:max(4px,calc((100vw - 720px) / 2 - 190px))}
.chispa-fig{right:max(4px,calc((100vw - 720px) / 2 - 180px));height:min(30vh,280px)}
.crew-fig[hidden]{display:none}

/* on a narrow screen they would sit on top of the tiles, so hide them */
@media (max-width:900px){
  .crew-fig{display:none}
}

/* when the content is taller than the screen, scroll from the top so the
   logo is never sliced off */
.veil{justify-content:safe center}
@supports not (justify-content: safe center){
  .veil{justify-content:flex-start}
}
.veil.wake{z-index:12;cursor:pointer}

/* full-bleed artwork behind the opening and the celebration */
.scene-wake,.scene-win{background:#0E7C86}
.scene-wake::before,.scene-win::before{
  content:'';position:absolute;inset:0;
  background-size:cover;background-position:center;
  pointer-events:none;
}
.scene-wake::before{background-image:url('village-scene.jpg')}
.scene-win::before{background-image:url('ciela-chispa.jpg')}
.scene-wake::after,.scene-win::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(8,50,60,.30),rgba(8,50,60,.68));
}
.scene-wake > *,.scene-win > *{position:relative;z-index:1}

.veil-mark{width:min(52vw,280px);max-height:22vh;height:auto;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 6px 18px rgba(8,50,60,.45))}
.veil-mark[hidden]{display:none}

.veil h1{
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:clamp(26px,8vw,52px);color:#fff;
  text-shadow:0 3px 0 var(--teal-deep),0 8px 22px rgba(8,50,60,.5);line-height:1.05;
}
.veil p{
  font-size:clamp(14px,4vw,20px);font-weight:700;color:#fff;
  text-shadow:0 2px 8px rgba(8,50,60,.6);max-width:24ch;
}

.tap-hint{
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(17px,4.8vw,26px);color:#fff;
  text-shadow:0 2px 10px rgba(8,50,60,.7);
  animation:breathe 2.2s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:.65;transform:scale(1)}
  50%{opacity:1;transform:scale(1.05)}
}

.tiles{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(clamp(104px,25vw,150px),1fr));
  gap:clamp(9px,2.4vw,18px);
  width:min(94vw,700px);
}

.tile{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:clamp(11px,2.6vw,18px) 8px clamp(9px,2vw,14px);
  border:0;border-radius:22px;cursor:pointer;
  background:rgba(255,255,255,.9);
  box-shadow:0 5px 0 rgba(11,90,98,.55),0 12px 24px rgba(8,50,60,.32),inset 0 0 0 2.5px var(--gold);
  transition:transform .18s ease,box-shadow .18s ease;
}
.tile:hover,.tile:focus-visible{transform:translateY(-3px)}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(11,90,98,.55),0 5px 12px rgba(8,50,60,.32),inset 0 0 0 2.5px var(--gold)}
.tile:focus-visible{outline:4px solid #fff;outline-offset:4px}

.tile img{width:clamp(44px,11vw,72px);height:auto}
.tile .glyphicon{
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:clamp(26px,6.6vw,44px);line-height:1.15;
  letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;
  height:clamp(44px,11vw,72px);
  color:transparent;
  background-image:linear-gradient(165deg,#FFFFFF 0%,#BFF0F4 24%,var(--teal) 62%,var(--teal-deep) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:clamp(1.5px,.45vw,2.6px) var(--gold);
  paint-order:stroke fill;
}
.tile span{
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(14px,3.4vw,20px);color:var(--navy);line-height:1.1;
}

.tile .tally{
  font-family:'Nunito',sans-serif;font-weight:700;
  font-size:clamp(10px,2.4vw,13px);
  color:var(--teal);opacity:.75;letter-spacing:.02em;
}

.chest{
  display:flex;align-items:center;gap:9px;
  padding:clamp(9px,2.2vw,13px) clamp(16px,4vw,26px);
  border:0;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.92);
  box-shadow:0 5px 0 rgba(11,90,98,.5),0 10px 20px rgba(8,50,60,.32),inset 0 0 0 2.5px var(--gold);
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(14px,3.6vw,19px);color:var(--navy);
  transition:transform .16s ease,box-shadow .16s ease;
}
.chest:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(11,90,98,.5),0 4px 10px rgba(8,50,60,.32),inset 0 0 0 2.5px var(--gold)}
.chest:focus-visible{outline:4px solid #fff;outline-offset:3px}
.chest-icon{color:var(--gold);font-size:1.15em;line-height:1}
.chest-text b{color:var(--teal)}

.vault{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(clamp(66px,17vw,110px),1fr));
  gap:clamp(6px,1.8vw,12px);
  width:min(94vw,660px);
  max-height:58vh;overflow-y:auto;
  padding:clamp(8px,2vw,14px);
  background:rgba(255,255,255,.18);
  border-radius:22px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
}

.slot{
  aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  border-radius:16px;
  background:rgba(255,255,255,.9);
  box-shadow:inset 0 0 0 2px var(--gold),0 3px 8px rgba(8,50,60,.28);
  padding:8%;
  position:relative;
}
.slot img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}

.slot.locked{
  background:rgba(255,255,255,.2);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.32);
}
.slot.locked img{filter:brightness(0) invert(1);opacity:.24}
.slot.locked::after{
  content:'\2605 ' attr(data-cost);
  position:absolute;bottom:4px;left:0;right:0;
  font-family:'Nunito',sans-serif;font-weight:800;
  font-size:clamp(9px,2.2vw,12px);color:#fff;opacity:.85;
  text-shadow:0 1px 4px rgba(8,50,60,.7);
}
.slot.fresh{animation:matchPop .6s cubic-bezier(.34,1.56,.64,1)}

.prize{display:flex;flex-direction:column;align-items:center;gap:4px}
.prize[hidden]{display:none}
.prize-line{
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:clamp(15px,4vw,21px);color:#fff;
  text-shadow:0 2px 8px rgba(8,50,60,.6);
}
.prize img{
  width:clamp(80px,24vw,150px);height:auto;
  filter:drop-shadow(0 6px 14px rgba(8,50,60,.5));
  animation:matchPop .7s cubic-bezier(.34,1.56,.64,1);
}
.prize-name{
  font-family:'Nunito',sans-serif;font-weight:800;
  font-size:clamp(12px,3.2vw,16px);color:#fff;
  text-shadow:0 2px 8px rgba(8,50,60,.6);
}

.grownups{
  margin-top:4px;border:0;background:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-weight:700;
  font-size:clamp(12px,3vw,15px);color:#fff;opacity:.75;
  text-shadow:0 2px 8px rgba(8,50,60,.6);
  padding:8px 14px;border-radius:999px;
}
.grownups:hover,.grownups:focus-visible{opacity:1}
.grownups:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* ---------- parent report ---------- */

.veil.report{justify-content:flex-start;padding-top:max(24px,env(safe-area-inset-top))}

.report-body{
  width:min(94vw,640px);
  display:flex;flex-direction:column;gap:14px;
  background:rgba(255,255,255,.93);
  border-radius:22px;padding:16px 18px;
  box-shadow:0 12px 30px rgba(8,50,60,.4),inset 0 0 0 2.5px var(--gold);
  text-align:left;
}

.report-mode h2{
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(15px,3.8vw,20px);color:var(--navy);
  margin-bottom:6px;
}
.report-mode .none{font-size:13px;font-weight:600;color:#6a7f8c}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.chipitem{
  display:flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:999px;
  font-family:'Nunito',sans-serif;font-weight:800;
  font-size:clamp(11px,2.8vw,14px);
  background:#E7EDF0;color:#6a7f8c;
  box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.06);
}
.chipitem .n{font-size:.85em;font-weight:700;opacity:.85}
.chipitem.solid{background:#D6F2E2;color:#1d7a4d;box-shadow:inset 0 0 0 1.5px #7fd1a6}
.chipitem.shaky{background:#FBE6C8;color:#8a5a10;box-shadow:inset 0 0 0 1.5px #e8b75a}
.chipitem.hard{background:#F9D9D4;color:#96382b;box-shadow:inset 0 0 0 1.5px #e8705a}

.legend{
  display:flex;flex-wrap:wrap;gap:10px;
  font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;color:#5b6f7c;
  padding-top:2px;
}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.go.danger{color:#8f3326}

.levels{display:flex;flex-direction:column;gap:clamp(8px,2vw,14px);width:min(92vw,420px)}

.level{
  display:flex;align-items:center;gap:12px;
  padding:clamp(11px,2.6vw,16px) clamp(14px,3vw,20px);
  border:0;border-radius:20px;cursor:pointer;text-align:left;
  background:rgba(255,255,255,.92);
  box-shadow:0 5px 0 rgba(11,90,98,.55),0 10px 20px rgba(8,50,60,.3),inset 0 0 0 2.5px var(--gold);
  transition:transform .16s ease,box-shadow .16s ease;
}
.level:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(11,90,98,.55),0 4px 10px rgba(8,50,60,.3),inset 0 0 0 2.5px var(--gold)}
.level:focus-visible{outline:4px solid #fff;outline-offset:3px}
.level .lv-badge{font-size:clamp(22px,6vw,32px);line-height:1;flex:0 0 auto}
.level .lv-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.level .lv-name{font-family:'Baloo 2',cursive;font-weight:700;font-size:clamp(15px,3.8vw,20px);color:var(--navy)}
.level .lv-sub{font-family:'Nunito',sans-serif;font-weight:700;font-size:clamp(11px,2.8vw,13px);color:#5b7f88}
.level .lv-stars{margin-left:auto;font-size:clamp(11px,2.8vw,14px);color:var(--gold);font-weight:800;white-space:nowrap}

/* ---------- Chispa's quiet corner ---------- */

.corner{
  position:relative;
  flex:1;min-height:0;width:100%;
  border-radius:20px;overflow:hidden;
  background-image:url('quiet-corner.jpg');
  background-size:cover;background-position:center bottom;
  box-shadow:inset 0 0 0 3px var(--gold),0 6px 16px rgba(9,60,70,.3);
  touch-action:none;
}

/* the rug is roughly the middle-lower half of the picture */
.corner-rug{
  position:absolute;left:6%;right:22%;top:52%;bottom:6%;
  border-radius:50%;
}

.cosy{
  position:absolute;
  width:var(--cw,86px);
  transform:translate(-50%,-50%);
  cursor:grab;touch-action:none;
  filter:drop-shadow(0 5px 10px rgba(9,60,70,.45));
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.cosy:active{cursor:grabbing}
.cosy.placed{filter:drop-shadow(0 4px 9px rgba(9,60,70,.4))}
.cosy.pop{animation:matchPop .45s cubic-bezier(.34,1.56,.64,1)}

.tray{
  flex:0 0 auto;
  display:flex;gap:clamp(8px,3vw,20px);
  align-items:center;justify-content:center;
  padding-top:4px;
}
.tray-item{
  width:clamp(52px,15vw,96px);
  border:0;background:none;padding:0;cursor:pointer;
  transition:transform .2s ease,opacity .3s ease;
}
.tray-item img{width:100%;height:auto;filter:drop-shadow(0 4px 9px rgba(9,60,70,.4))}
.tray-item:hover,.tray-item:focus-visible{transform:translateY(-4px)}
.tray-item:focus-visible{outline:4px solid #fff;outline-offset:4px;border-radius:14px}
.tray-item.done{opacity:.25;pointer-events:none}

/* ---------- stretch along ---------- */

.stretch-stage{
  flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  width:100%;
}
.stretch-stage img{
  max-height:100%;max-width:min(60vw,300px);
  width:auto;height:auto;object-fit:contain;
  filter:drop-shadow(0 8px 16px rgba(9,60,70,.4));
  transition:opacity .45s ease,transform .45s ease;
}
.stretch-stage img.swap{opacity:0;transform:scale(.94)}

.hold-ring{
  width:clamp(48px,13vw,84px);height:clamp(48px,13vw,84px);
  flex:0 0 auto;
}
.hold-ring circle{transition:stroke-dashoffset .25s linear}

/* ---------- calm-down clouds ---------- */

.calm{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(8px,2.4vh,20px);
  padding:clamp(6px,1.6vw,14px);
  overflow:hidden;text-align:center;
}

.calm-say{
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(15px,4vw,24px);color:var(--navy);
  background:rgba(255,255,255,.86);
  padding:9px 22px;border-radius:999px;
  box-shadow:0 4px 16px rgba(12,70,80,.2),inset 0 0 0 2px rgba(232,183,90,.55);
  max-width:92%;
}

.faces{display:flex;flex-wrap:wrap;gap:clamp(7px,2.4vw,16px);justify-content:center;max-width:96%}
.face{
  width:clamp(64px,18vw,116px);
  border:0;background:none;padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform .18s ease;
}
.face:hover,.face:focus-visible{transform:translateY(-3px)}
.face:focus-visible{outline:4px solid #fff;outline-offset:4px;border-radius:18px}
.face svg{width:100%;height:auto;filter:drop-shadow(0 5px 10px rgba(9,60,70,.35))}
.face span{
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(11px,3vw,15px);color:var(--navy);
}

/* breathing cloud - slow, no flashing */
.breath-stage{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  width:min(66vw,320px);height:min(66vw,320px);
}
.breath-cloud{
  width:36%;height:36%;
  transition-property:transform;
  transition-timing-function:cubic-bezier(.37,0,.63,1);
  transition-duration:5s;
  transform:scale(1);
}
.breath-cloud.inhale{transform:scale(2.5)}
.breath-cloud svg{width:100%;height:auto}

.breath-dots{display:flex;gap:9px}
.bdot{
  width:clamp(15px,4vw,24px);height:clamp(15px,4vw,24px);
  border-radius:50%;
  background:rgba(255,255,255,.35);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.7);
  transition:background .6s ease,box-shadow .6s ease;
}
.bdot.on{
  background:linear-gradient(150deg,var(--gold-light),var(--gold));
  box-shadow:inset 0 0 0 2px #fff,0 0 14px rgba(232,183,90,.8);
}

/* star tapping */
.star-row{display:flex;flex-wrap:wrap;gap:clamp(8px,3vw,22px);justify-content:center;max-width:94%}
.cstar{
  width:clamp(46px,13vw,86px);
  border:0;background:none;padding:0;cursor:pointer;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;
}
.cstar svg{width:100%;height:auto;opacity:.42;filter:drop-shadow(0 4px 8px rgba(9,60,70,.35));transition:opacity .4s ease}
.cstar.lit svg{opacity:1}
.cstar.lit{transform:scale(1.1)}
.cstar:focus-visible{outline:4px solid #fff;outline-offset:4px;border-radius:14px}

/* activity chooser */
.acts{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(clamp(96px,25vw,150px),1fr));
  gap:clamp(7px,2vw,14px);
  width:min(94vw,620px);
}
.act{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:clamp(9px,2.4vw,15px) 8px;
  border:0;border-radius:20px;cursor:pointer;
  background:rgba(255,255,255,.9);
  box-shadow:0 4px 0 rgba(11,90,98,.5),0 9px 18px rgba(8,50,60,.28),inset 0 0 0 2.5px var(--gold);
  transition:transform .16s ease;
}
.act:active{transform:translateY(3px)}
.act:focus-visible{outline:4px solid #fff;outline-offset:3px}
.act .act-ico{font-size:clamp(21px,6vw,32px);line-height:1}
.act .act-name{
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(12px,3.1vw,16px);color:var(--navy);line-height:1.15;
}

/* glitter jar */
#glitter{
  width:min(62vw,280px);height:min(62vw,280px);max-height:46vh;
  border-radius:26% 26% 18% 18%/16%;
  background:linear-gradient(180deg,rgba(190,235,245,.65),rgba(90,175,205,.75));
  box-shadow:inset 0 0 0 4px var(--gold),inset 0 6px 20px rgba(255,255,255,.5),0 8px 20px rgba(9,60,70,.35);
  cursor:pointer;touch-action:manipulation;
}

/* free drawing */
#doodle{
  width:min(92vw,520px);height:min(56vh,380px);
  border-radius:20px;background:#fff;
  box-shadow:inset 0 0 0 3px var(--gold),0 8px 20px rgba(9,60,70,.32);
  touch-action:none;cursor:crosshair;
}
.pens{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pen{
  width:clamp(28px,7vw,40px);height:clamp(28px,7vw,40px);
  border:0;border-radius:50%;cursor:pointer;
  box-shadow:0 3px 8px rgba(9,60,70,.35),inset 0 0 0 2.5px rgba(255,255,255,.9);
}
.pen.on{box-shadow:0 3px 8px rgba(9,60,70,.35),inset 0 0 0 3px #fff,0 0 0 3px var(--gold)}

/* soundscape buttons */
.sounds{display:flex;flex-wrap:wrap;gap:clamp(7px,2.4vw,14px);justify-content:center}
.snd{
  padding:clamp(9px,2.4vw,14px) clamp(15px,4vw,26px);
  border:0;border-radius:999px;cursor:pointer;
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(13px,3.4vw,18px);color:var(--navy);
  background:rgba(255,255,255,.9);
  box-shadow:0 4px 0 rgba(11,90,98,.45),inset 0 0 0 2.5px var(--gold);
}
.snd.on{background:linear-gradient(165deg,var(--gold-light),var(--gold))}

/* sticker shelf */
.stickers{display:flex;flex-wrap:wrap;gap:clamp(7px,2.4vw,14px);justify-content:center;max-width:94%}
.sticker{
  width:clamp(52px,14vw,92px);
  opacity:.28;filter:grayscale(1);
  transition:opacity .5s ease,filter .5s ease,transform .5s cubic-bezier(.34,1.56,.64,1);
}
.sticker.have{opacity:1;filter:none}
.sticker.fresh{transform:scale(1.18)}
.sticker svg{width:100%;height:auto;filter:drop-shadow(0 4px 9px rgba(9,60,70,.35))}

/* ---------- crystal garden ---------- */

.garden{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  gap:clamp(4px,1.4vh,12px);
  padding:clamp(4px,1.2vw,12px);
  overflow:hidden;
}

.garden-field{
  position:relative;
  flex:1;min-height:0;
}

.crystal{
  position:absolute;
  transform:translate(-50%,-50%);
  border:0;background:none;padding:4px;cursor:pointer;
  animation:drift var(--dur) ease-in-out var(--delay) infinite alternate;
  touch-action:manipulation;
}
.crystal svg{
  display:block;width:var(--size);height:auto;
  filter:drop-shadow(0 5px 10px rgba(9,60,70,.45));
  transition:filter .25s ease;
}
.crystal:focus-visible{outline:4px solid #fff;outline-offset:5px;border-radius:14px}

.crystal.counted svg{filter:drop-shadow(0 0 14px rgba(255,255,255,.95)) brightness(1.12)}
.crystal.counted::after{
  content:attr(data-n);
  position:absolute;top:-6px;right:-6px;
  min-width:clamp(19px,5vw,30px);height:clamp(19px,5vw,30px);
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:linear-gradient(150deg,var(--gold-light),var(--gold));
  color:var(--navy);
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:clamp(11px,3vw,17px);line-height:1;
  box-shadow:0 2px 7px rgba(9,60,70,.45);
  animation:matchPop .4s cubic-bezier(.34,1.56,.64,1);
}
.crystal.flyaway{animation:flyOff .55s ease-in forwards}
@keyframes flyOff{
  to{transform:translate(-50%,-50%) translate(var(--fx),var(--fy)) scale(.15) rotate(140deg);opacity:0}
}

.garden-ask{
  flex:0 0 auto;
  display:flex;flex-wrap:wrap;gap:clamp(8px,3vw,22px);
  align-items:center;justify-content:center;
  padding-bottom:2px;
  min-height:0;
}
.garden-ask[hidden]{display:none}

.numpick{
  width:var(--pick,66px);height:var(--pick,66px);
  border:0;border-radius:20px;cursor:pointer;
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:calc(var(--pick,66px) * .5);line-height:1;
  color:var(--navy);
  background:linear-gradient(165deg,#FFFFFF,#CFEDF1);
  box-shadow:inset 0 0 0 3px var(--gold),0 5px 0 rgba(11,90,98,.5),0 9px 16px rgba(9,60,70,.32);
  transition:transform .16s ease;
  animation:matchPop .45s cubic-bezier(.34,1.56,.64,1);
}
.numpick:active{transform:translateY(4px)}
.numpick:focus-visible{outline:4px solid #fff;outline-offset:3px}
.numpick.nope{animation:wobbleStatic .45s ease}
.garden-ask.locked .numpick{pointer-events:none}

.chest-target{
  position:absolute;right:6%;bottom:4%;
  width:clamp(40px,11vw,78px);height:auto;opacity:.9;
  pointer-events:none;
}

/* ---------- printable certificate ---------- */

.cert{
  width:min(94vw,620px);
  background:#fff;color:var(--navy);
  border-radius:22px;padding:clamp(18px,5vw,38px);
  text-align:center;
  box-shadow:0 14px 34px rgba(8,50,60,.45),inset 0 0 0 4px var(--gold);
}
.cert h2{
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:clamp(21px,6vw,34px);color:var(--teal);margin-bottom:4px;
}
.cert .who{
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:clamp(24px,7vw,40px);
  border-bottom:3px dashed rgba(14,124,134,.4);
  padding:10px 6px 6px;margin:10px 0;
}
.cert p{color:#43606d;font-size:clamp(12px,3.2vw,16px);font-weight:700;max-width:none}
.cert .cert-stats{
  display:flex;gap:clamp(10px,4vw,28px);justify-content:center;
  margin-top:14px;flex-wrap:wrap;
}
.cert .stat{display:flex;flex-direction:column}
.cert .stat b{font-family:'Baloo 2',cursive;font-size:clamp(20px,6vw,32px);color:var(--gold)}
.cert .stat span{font-size:clamp(10px,2.6vw,13px);color:#5b7f88;font-weight:800}

@media print{
  body{background:#fff}
  .stage,.veil{display:none!important}
  #certVeil{display:flex!important;position:static;background:none;backdrop-filter:none;padding:0}
  #certVeil .go,#certVeil h1{display:none!important}
  .cert{box-shadow:none;border:3px solid #E8B75A}
}

/* ---------- stepping stones ---------- */

.stream-wrap{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(6px,2vh,18px);
  padding:clamp(4px,1.2vw,12px);
  overflow:hidden;
}

.stream{
  position:relative;
  flex:0 0 auto;
  display:flex;gap:clamp(4px,1.4vw,12px);
  align-items:center;justify-content:center;
  max-width:96%;
  padding:clamp(10px,3vh,26px) clamp(6px,2vw,16px);
  border-radius:22px;
  background:linear-gradient(180deg,rgba(126,214,232,.55),rgba(58,164,192,.75));
  box-shadow:inset 0 2px 10px rgba(9,60,70,.3),inset 0 0 0 2px rgba(255,255,255,.35);
}

/* moving sparkle on the water */
.stream::after{
  content:'';position:absolute;left:0;right:0;top:50%;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
  animation:current 3.2s linear infinite;
}
@keyframes current{
  0%{transform:translateX(-40%)}100%{transform:translateX(40%)}
}

.stone{
  position:relative;z-index:1;
  width:var(--stone,58px);height:var(--stone,58px);
  border-radius:46% 54% 50% 50%/52% 48% 54% 46%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:calc(var(--stone,58px) * .44);line-height:1;
}

.stone.gap{
  background:rgba(255,255,255,.2);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);
}
.stone.set{
  background:linear-gradient(165deg,#E4E9EC,#93A6AE);
  color:#2C4450;
  box-shadow:inset 0 0 0 3px var(--gold),0 4px 0 #6E828B,0 8px 14px rgba(9,60,70,.35);
  animation:stoneDrop .34s cubic-bezier(.34,1.56,.64,1);
}
@keyframes stoneDrop{
  0%{transform:translateY(-24px) scale(.7);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}
.stone.given{
  background:linear-gradient(165deg,#DCE3E6,#A9B8BF);
  color:#2C4450;
  box-shadow:inset 0 0 0 3px rgba(232,183,90,.7),0 4px 0 #7C8E96;
}
.stream.done .stone{box-shadow:inset 0 0 0 3px var(--gold),0 4px 0 #6E828B,0 0 20px rgba(232,183,90,.8)}

.walker{
  position:absolute;z-index:2;
  bottom:calc(100% - clamp(8px,2.4vh,20px));
  left:0;
  width:var(--walk,54px);height:auto;
  transform:translateX(-50%);
  transition:left .42s cubic-bezier(.34,1.4,.64,1);
  filter:drop-shadow(0 5px 10px rgba(9,60,70,.45));
  pointer-events:none;
}
.walker[hidden]{display:none}
.walker.hop{animation:hop .42s cubic-bezier(.34,1.56,.64,1)}

/* ---------- word bridge ---------- */

.bridge-wrap{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(6px,1.8vh,16px);
  padding:clamp(4px,1.2vw,12px);
  overflow:hidden;
}

.bridge-clue{
  flex:0 1 auto;min-height:0;
  display:flex;align-items:center;justify-content:center;
}
.bridge-clue img{
  max-height:clamp(60px,20vh,190px);max-width:44vw;
  width:auto;height:auto;object-fit:contain;
  filter:drop-shadow(0 6px 12px rgba(9,60,70,.4));
  animation:bobble 3s ease-in-out infinite alternate;
}

.bridge{
  flex:0 0 auto;
  display:flex;gap:clamp(3px,1vw,9px);
  align-items:flex-end;justify-content:center;
  max-width:96%;
}

.plank{
  position:relative;
  width:var(--plank,58px);height:calc(var(--plank,58px) * 1.12);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:calc(var(--plank,58px) * .58);line-height:1;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
}

/* an unbuilt span of the bridge - a gap over the clouds */
.plank.gap{
  background:rgba(255,255,255,.16);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.5);
  border-radius:10px;
}
.plank.gap::after{
  content:'';position:absolute;left:12%;right:12%;bottom:-9px;height:4px;
  border-radius:3px;background:rgba(255,255,255,.35);
}

/* a repaired plank */
.plank.built{
  background:linear-gradient(170deg,#F3D9A4,#C99A4E);
  color:#5A3A12;
  box-shadow:inset 0 0 0 3px var(--gold),0 5px 0 #A87C33,0 9px 14px rgba(9,60,70,.35);
  animation:plankDrop .34s cubic-bezier(.34,1.56,.64,1);
}
@keyframes plankDrop{
  0%{transform:translateY(-26px) rotate(-7deg);opacity:0}
  100%{transform:translateY(0) rotate(0);opacity:1}
}

.plank.given{
  background:linear-gradient(170deg,#E7E0CE,#BCAF92);
  color:#5A3A12;
  box-shadow:inset 0 0 0 3px rgba(232,183,90,.7),0 5px 0 #9c9075;
}

.bridge.done .plank{box-shadow:inset 0 0 0 3px var(--gold),0 5px 0 #A87C33,0 0 22px rgba(232,183,90,.85)}

.tiles-row{
  flex:0 0 auto;
  display:flex;flex-wrap:wrap;gap:clamp(4px,1.4vw,12px);
  align-items:center;justify-content:center;
  max-width:96%;
}

.ltile{
  width:var(--tile,54px);height:var(--tile,54px);
  border:0;border-radius:14px;cursor:pointer;
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:calc(var(--tile,54px) * .55);line-height:1;
  color:var(--navy);
  background:linear-gradient(165deg,#FFFFFF,#CFEDF1);
  box-shadow:inset 0 0 0 2.5px var(--gold),0 4px 0 rgba(11,90,98,.5),0 8px 14px rgba(9,60,70,.3);
  transition:transform .16s ease,opacity .2s ease;
}
.ltile:active{transform:translateY(3px)}
.ltile:focus-visible{outline:4px solid #fff;outline-offset:3px}
.ltile.used{opacity:0;pointer-events:none;transform:scale(.4)}
.ltile.nope{animation:wobbleStatic .45s ease}

.tiles-row.locked .ltile{pointer-events:none}

.stars-line{
  font-size:clamp(16px,4.5vw,26px);letter-spacing:.12em;
  filter:drop-shadow(0 2px 6px rgba(8,50,60,.5));
}

/* ---------- memory cards ---------- */

.deck-wrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(3px,1vw,10px);
  overflow:hidden;
}

.deck{
  width:100%;height:100%;
  display:grid;
  /* rows are explicit so the deck can never grow taller than the field
     and spill cards over each other */
  grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  grid-template-rows:repeat(var(--rows),minmax(0,1fr));
  gap:clamp(4px,1.2vw,12px);
}

.card{
  position:relative;
  width:100%;height:100%;
  min-width:0;min-height:0;
  border:0;background:none;padding:0;cursor:pointer;
  perspective:800px;
}
.card:focus-visible{outline:4px solid #fff;outline-offset:3px;border-radius:16px}

.card-inner{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transition:transform .42s cubic-bezier(.34,1.3,.64,1);
}
.card.flipped .card-inner{transform:rotateY(180deg)}

.card-face{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:clamp(9px,2.2vw,16px);
  overflow:hidden;
}

.card-back{
  background:linear-gradient(160deg,#1298a5,var(--teal-deep));
  box-shadow:inset 0 0 0 2.5px var(--gold),0 5px 12px rgba(9,60,70,.4);
}
.card-back img{width:60%;max-height:70%;height:auto;object-fit:contain;opacity:.95}
.card-back .paw{font-size:clamp(20px,6vw,40px)}

.card-front{
  transform:rotateY(180deg);
  overflow:hidden;
  background:linear-gradient(170deg,#FFFFFF,#DFF3F6);
  box-shadow:inset 0 0 0 2.5px var(--gold),0 5px 12px rgba(9,60,70,.4);
  padding:8%;
}
.card-front img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.card-front .face-glyph{
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:var(--glyph,28px);line-height:1;
  color:transparent;
  background-image:linear-gradient(165deg,#FFFFFF 0%,#BFF0F4 26%,var(--teal) 62%,var(--teal-deep) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:clamp(1.5px,.5vw,3px) var(--gold);
  paint-order:stroke fill;
}

.card.matched{animation:matchPop .5s cubic-bezier(.34,1.56,.64,1)}
.card.matched .card-front{
  box-shadow:inset 0 0 0 3px var(--mint),0 0 18px rgba(79,197,140,.7);
}
.card.matched{pointer-events:none}
@keyframes matchPop{
  0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}
}
.card.settled{opacity:.62}

.deck.locked .card{pointer-events:none}

.veil.report p.note{
  color:#fff;font-size:13px;font-weight:600;max-width:44ch;
  text-shadow:0 2px 8px rgba(8,50,60,.6);
}

.go{
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:clamp(18px,4.8vw,28px);color:var(--navy);
  background:linear-gradient(165deg,var(--gold-light),var(--gold));
  border:0;border-radius:999px;
  padding:clamp(11px,2.4vh,17px) clamp(28px,7vw,52px);cursor:pointer;
  box-shadow:0 6px 0 #B98A32,0 12px 26px rgba(8,50,60,.4);
  transition:transform .16s ease,box-shadow .16s ease;
}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 #B98A32,0 5px 14px rgba(8,50,60,.4)}
.go:focus-visible{outline:4px solid #fff;outline-offset:4px}

.go.ghost{
  background:rgba(255,255,255,.85);
  box-shadow:0 5px 0 rgba(11,90,98,.5),0 10px 20px rgba(8,50,60,.35);
  font-size:clamp(15px,4vw,21px);
  padding:clamp(9px,2vh,14px) clamp(22px,6vw,40px);
}
.go.ghost:active{box-shadow:0 1px 0 rgba(11,90,98,.5),0 4px 10px rgba(8,50,60,.35)}

.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.trophy{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:300px}
.trophy .gem{width:24px;height:24px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <header class="bar">
    <div class="bar-left">
      <button class="chip" id="home" aria-label="Back to the games">&#127968;</button>
      <img class="mark" id="mark" src="cielaWorldLogo.png" alt="Ciela's World of Learning">
    </div>
    <div class="bar-right">
      <div class="gems" id="gems" aria-label="Gems collected"></div>
      <button class="chip" id="mute" aria-label="Turn sound off" aria-pressed="false">&#128266;</button>
    </div>
  </header>

  <p class="prompt" id="prompt"></p>

  <div class="field" id="field" role="group" aria-label="Choices"></div>

  <div class="crew">
    <button class="teacher" id="again" aria-label="Ask Ciela to say it again">
      <img class="ciela" id="ciela" src="cielaBust.png" alt="Ciela">
      <span class="speaker" aria-hidden="true">&#128266;</span>
    </button>
    <img class="pup" id="chispa" src="chispa-content.png" alt="">
  </div>
</div>

<div class="veil wake scene-wake" id="wakeVeil">
  <img class="veil-mark" id="wakeMark" src="cielaWorldLogo.png" alt="Ciela's World of Learning">
  <p class="tap-hint">Tap anywhere to begin</p>
</div>

<div class="veil solid" id="homeVeil" hidden>
  <img class="crew-fig ciela-fig" id="homeCiela" src="ciela-hello.png" alt="">
  <img class="crew-fig chispa-fig" id="homeChispa" src="chispa-look.png" alt="">
  <img class="veil-mark" id="homeMark" src="cielaWorldLogo.png" alt="Ciela's World of Learning">
  <p>Pick a game to play with Ciela.</p>
  <div class="tiles" id="tiles"></div>
  <button class="chest" id="chestBtn">
    <span class="chest-icon">&#9733;</span>
    <span class="chest-text">Treasures <b id="chestCount">0 / 20</b></span>
  </button>
  <button class="grownups" id="grownupsBtn">For grown-ups</button>
</div>

<div class="veil" id="certVeil" hidden>
  <h1>Certificate</h1>
  <div class="cert" id="certBody"></div>
  <div class="row">
    <button class="go ghost" id="certPrint">Print</button>
    <button class="go ghost" id="certClose">Done</button>
  </div>
</div>

<div class="veil" id="vaultVeil" hidden>
  <h1>Your Treasures</h1>
  <p id="vaultLine">Earn stars to find more.</p>
  <div class="vault" id="vaultGrid"></div>
  <button class="go ghost" id="vaultClose">Done</button>
</div>

<div class="veil" id="gateVeil" hidden>
  <h1>Grown-ups only</h1>
  <p id="gateQuestion">Tap the answer</p>
  <div class="row" id="gateOptions"></div>
  <button class="go ghost" id="gateCancel">Never mind</button>
</div>

<div class="veil report" id="reportVeil" hidden>
  <h1>Progress</h1>
  <div class="report-body" id="reportBody"></div>
  <div class="row">
    <button class="go ghost" id="reportClose">Done</button>
    <button class="go ghost" id="reportCert">Certificate</button>
    <button class="go ghost danger" id="reportReset">Start over</button>
  </div>
</div>

<div class="veil" id="levelVeil" hidden>
  <h1>Build the Word Bridge</h1>
  <p>Pick how tricky it should be.</p>
  <div class="levels" id="levelList"></div>
  <button class="go ghost" id="levelBack">Other games</button>
</div>

<div class="veil scene-win" id="winVeil" hidden>
  <h1 id="winTitle">You did it!</h1>
  <div class="trophy" id="trophy"></div>
  <div class="prize" id="prize" hidden>
    <p class="prize-line">New treasure!</p>
    <img id="prizeImg" src="" alt="">
    <p class="prize-name" id="prizeName"></p>
  </div>
  <div class="row">
    <button class="go" id="againBtn">Play again</button>
    <button class="go ghost" id="backBtn">Other games</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ==========================================================
     Content
     ========================================================== */

  var WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
  var CHEERS = ['Great job!','You got it!','Nice tapping!','Well done!','That is the one!'];
  var ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  /* Word Bridge. Every word is one of Ciela's props, so the picture above
     the bridge always tells a non-reader what they are spelling. */
  var BRIDGE_LEVELS = [
    { id:'cloud',   name:'Cloud Beginner',   badge:'\u2601\uFE0F',
      note:'Short words, one plank missing',
      words:['cat','egg','hat','jar','key','sun'], blanks:1, decoys:1 },
    { id:'golden',  name:'Golden Explorer',  badge:'\u2728',
      note:'Whole word, a few spare letters',
      words:['ball','drum','goat','moon','nest','rope'], blanks:0, decoys:2 },
    { id:'crystal', name:'Crystal Champion', badge:'\uD83D\uDC8E',
      note:'Longer words, more spare letters',
      words:['apple','queen','wagon','zebra','flower','orange','violin'], blanks:0, decoys:3 }
  ];

  /* Number Stepping Stones. Sequences are fixed so a parent can see
     exactly which ones a child has managed. */
  /* ---------- Calm-Down Clouds ---------- */

  var FEELINGS = [
    { key:'angry',      name:'Angry',      brow:'M22 30 L40 38',  brow2:'M78 30 L60 38', mouth:'M32 74 Q50 62 68 74', tint:'#F2A08E' },
    { key:'sad',        name:'Sad',        brow:'M22 34 L40 30',  brow2:'M78 34 L60 30', mouth:'M32 76 Q50 62 68 76', tint:'#9FC2E8' },
    { key:'worried',    name:'Worried',    brow:'M22 32 L40 28',  brow2:'M78 32 L60 28', mouth:'M34 72 Q50 78 66 70', tint:'#C7B6E6' },
    { key:'frustrated', name:'Frustrated', brow:'M22 28 L40 34',  brow2:'M78 28 L60 34', mouth:'M32 72 L68 72',       tint:'#F0C27B' },
    { key:'excited',    name:'Excited',    brow:'M22 28 L40 24',  brow2:'M78 28 L60 24', mouth:'M30 66 Q50 86 70 66',  tint:'#9BE0C0' }
  ];

  var STICKERS = [
    { key:'cloud',   name:'Calm Cloud' },
    { key:'sun',     name:'Smiling Sun' },
    { key:'rainbow', name:'Gentle Rainbow' },
    { key:'drop',    name:'Sparkling Raindrop' },
    { key:'star',    name:'Golden Star' },
    { key:'moon',    name:'Peaceful Moon' }
  ];

  /* Poses for Stretch Like Ciela. Held slowly, three in a row. */
  var STRETCHES = [
    { file:'ciela-reach.png',      say:'Reach up as tall as you can.' },
    { file:'ciela-side-left.png',  say:'Lean gently to one side.',      side:1 },
    { file:'ciela-side-right.png', say:'Now lean to the other side.',   side:2 },
    { file:'ciela-bend.png',       say:'Bend forward and let your arms hang.' },
    { file:'ciela-open.png',       say:'Open your arms out wide.' }
  ];

  /* Comfort items for Chispa's quiet corner */
  var COSY = [
    { key:'pillow',  file:'cosy-pillow.png',  name:'pillow',  w:0.30, at:[34,58] },
    { key:'blanket', file:'cosy-blanket.png', name:'blanket', w:0.30, at:[58,66] },
    { key:'toy',     file:'cosy-toy.png',     name:'soft toy',w:0.20, at:[45,44] }
  ];

  var CALM_ACTS = [
    { key:'stretch', ico:'\uD83E\uDD38', name:'Stretch Like Ciela' },
    { key:'corner',  ico:'\uD83D\uDECF\uFE0F', name:"Chispa's Quiet Corner" },
    { key:'stars',  ico:'\u2b50', name:'Count Five Stars' },
    { key:'jar',    ico:'\u2728', name:'Shake and Settle' },
    { key:'draw',   ico:'\uD83C\uDFA8', name:'Draw the Feeling' },
    { key:'sounds', ico:'\uD83C\uDF27\uFE0F', name:'Peaceful Sounds' },
    { key:'five',   ico:'\uD83D\uDC40', name:'Name Five Things' },
    { key:'help',   ico:'\uD83E\uDD1D', name:'Ask for Help' }
  ];

  var CRYSTAL_COLOURS = [
    { key:'blue',   name:'blue',   hi:'#BFE9FF', mid:'#4EA8E8', low:'#1F5FA8' },
    { key:'purple', name:'purple', hi:'#E6D2FF', mid:'#9B6BE0', low:'#5B2F9E' },
    { key:'pink',   name:'pink',   hi:'#FFD9EC', mid:'#F07FB4', low:'#B23A75' },
    { key:'green',  name:'green',  hi:'#D5F7DE', mid:'#57C67F', low:'#1F7A47' },
    { key:'gold',   name:'gold',   hi:'#FFF0C4', mid:'#EDBB55', low:'#A9761C' }
  ];

  var CRYSTAL_WIN = ['Crystal counting complete!','Wonderful counting!',
                     'You found the correct number!','You are becoming a Crystal Champion!'];
  var CRYSTAL_TRY = ['Almost! Let us count them together.',
                     'Good try! Tap each crystal slowly.',
                     'Let us check our counting one more time.'];

  function runOf(start, step, len){
    var a = [];
    for(var i = 0; i < len; i++) a.push(start + i * step);
    return a;
  }

  var STONE_LEVELS = [
    { id:'cloud', name:'Cloud Beginner', badge:'\u2601\uFE0F',
      note:'Five stones, two already placed', given:2, decoys:1,
      puzzles:[
        { id:'1-5',  seq:runOf(1,1,5) }, { id:'2-6',  seq:runOf(2,1,5) },
        { id:'3-7',  seq:runOf(3,1,5) }, { id:'4-8',  seq:runOf(4,1,5) },
        { id:'5-9',  seq:runOf(5,1,5) }, { id:'6-10', seq:runOf(6,1,5) }
      ] },
    { id:'golden', name:'Golden Explorer', badge:'\u2728',
      note:'Seven stones, none placed', given:0, decoys:2,
      puzzles:[
        { id:'1-7',  seq:runOf(1,1,7) }, { id:'2-8',  seq:runOf(2,1,7) },
        { id:'3-9',  seq:runOf(3,1,7) }, { id:'4-10', seq:runOf(4,1,7) }
      ] },
    { id:'crystal', name:'Crystal Champion', badge:'\uD83D\uDC8E',
      note:'Counting in steps', given:1, decoys:2,
      puzzles:[
        { id:'twos',   seq:runOf(2,2,6) }, { id:'threes', seq:runOf(3,3,6) },
        { id:'fives',  seq:runOf(5,5,6) }, { id:'tens',   seq:runOf(10,10,6) }
      ] }
  ];

  function stoneLevelById(id){
    for(var i = 0; i < STONE_LEVELS.length; i++){
      if(STONE_LEVELS[i].id === id) return STONE_LEVELS[i];
    }
    return STONE_LEVELS[0];
  }

  function levelById(id){
    for(var i = 0; i < BRIDGE_LEVELS.length; i++){
      if(BRIDGE_LEVELS[i].id === id) return BRIDGE_LEVELS[i];
    }
    return BRIDGE_LEVELS[0];
  }

  function propForWord(word){
    for(var i = 0; i < PROPS.length; i++){
      if(PROPS[i].one.toLowerCase() === word) return PROPS[i];
    }
    return null;
  }



  /* Prop art already in the repo. `many` drives the counting prompts (always
     plural — "How many lanterns?" reads naturally even when there is one),
     `letter` drives the alphabet clues, `key` names the audio clip. */
  var PROPS = [
    { key:'apple',     file:'apple-transparent.png',                     one:'apple',            many:'apples',             letter:'A' },
    { key:'ball',      file:'ball-transparent.png',                      one:'ball',             many:'balls',              letter:'B' },
    { key:'cat',       file:'cat-transparent.png',                       one:'cat',              many:'cats',               letter:'C' },
    { key:'drum',      file:'drum-transparent.png',                      one:'drum',             many:'drums',              letter:'D' },
    { key:'egg',       file:'egg-transparent.png',                       one:'egg',              many:'eggs',               letter:'E' },
    { key:'flower',    file:'flower-transparent.png',                    one:'flower',           many:'flowers',            letter:'F' },
    { key:'goat',      file:'goat-transparent.png',                      one:'goat',             many:'goats',              letter:'G' },
    { key:'hat',       file:'hat-transparent.png',                       one:'hat',              many:'hats',               letter:'H' },
    { key:'icecream',  file:'ice-cream-transparent.png',                 one:'ice cream',        many:'ice creams',         letter:'I' },
    { key:'jar',       file:'jar-transparent.png',                       one:'jar',              many:'jars',               letter:'J' },
    { key:'key',       file:'compass-key-transparent.png',               one:'key',              many:'keys',               letter:'K' },
    { key:'lantern',   file:'crystal-sky-lantern-transparent.png',       one:'lantern',          many:'lanterns',           letter:'L' },
    { key:'moon',      file:'moon-transparent.png',                      one:'moon',             many:'moons',              letter:'M' },
    { key:'nest',      file:'nest-transparent.png',                      one:'nest',             many:'nests',              letter:'N' },
    { key:'orange',    file:'orange-transparent.png',                    one:'orange',           many:'oranges',            letter:'O' },
    { key:'paintbrush',file:'paintbrush-transparent.png',                one:'paintbrush',       many:'paintbrushes',       letter:'P' },
    { key:'queen',     file:'queen-transparent.png',                     one:'queen',            many:'queens',             letter:'Q' },
    { key:'rope',      file:'climbing-rope-transparent.png',             one:'rope',             many:'ropes',              letter:'R' },
    { key:'sun',       file:'sun-transparent.png',                       one:'sun',              many:'suns',               letter:'S' },
    { key:'telescope', file:'celestial-telescope-transparent.png',       one:'telescope',        many:'telescopes',         letter:'T' },
    { key:'umbrella',  file:'umbrella-transparent.png',                  one:'umbrella',         many:'umbrellas',          letter:'U' },
    { key:'violin',    file:'violin-transparent.png',                    one:'violin',           many:'violins',            letter:'V' },
    { key:'wagon',     file:'wagon-transparent.png',                     one:'wagon',            many:'wagons',             letter:'W' },
    { key:'xylophone', file:'xylophone-transparent.png',                 one:'xylophone',        many:'xylophones',         letter:'X' },
    { key:'yoyo',      file:'yoyo-transparent.png',                      one:'yo-yo',            many:'yo-yos',             letter:'Y' },
    { key:'zebra',     file:'zebra-transparent.png',                     one:'zebra',            many:'zebras',             letter:'Z' }
  ];

  var SHAPES = [
    { key:'circle',   name:'circle' },
    { key:'square',   name:'square' },
    { key:'triangle', name:'triangle' },
    { key:'star',     name:'star' },
    { key:'heart',    name:'heart' },
    { key:'diamond',  name:'diamond' }
  ];

  var COLORS = [
    { key:'red',    name:'red',    hex:'#E4483C' },
    { key:'orange', name:'orange', hex:'#F08B32' },
    { key:'yellow', name:'yellow', hex:'#F5CE3F' },
    { key:'green',  name:'green',  hex:'#4CB963' },
    { key:'blue',   name:'blue',   hex:'#3C8BE4' },
    { key:'purple', name:'purple', hex:'#8B5FC9' },
    { key:'pink',   name:'pink',   hex:'#EC7BB0' },
    { key:'brown',  name:'brown',  hex:'#9A6B45' }
  ];

  /* ==========================================================
     Elements
     ========================================================== */

  var stage    = document.getElementById('stage');
  var field    = document.getElementById('field');
  var prompt   = document.getElementById('prompt');
  var gemRow   = document.getElementById('gems');
  var trophy   = document.getElementById('trophy');
  var ciela    = document.getElementById('ciela');
  var chispa   = document.getElementById('chispa');
  var teacher  = document.getElementById('again');
  var wakeVeil = document.getElementById('wakeVeil');
  var homeVeil = document.getElementById('homeVeil');
  var winVeil  = document.getElementById('winVeil');
  var winTitle = document.getElementById('winTitle');
  var tiles    = document.getElementById('tiles');

  var modeKey = null;
  var mode = null;
  var rounds = [];
  var index = 0;
  var busy = false;
  var audioCtx = null;

  /* ==========================================================
     Art that may be missing degrades quietly
     ========================================================== */

  function hideIfBroken(el){
    if(!el) return;
    el.addEventListener('error', function(){ el.hidden = true; });
    if(el.complete && el.naturalWidth === 0) el.hidden = true;
  }
  ['mark','ciela','chispa','wakeMark','homeMark','homeCiela','homeChispa'].forEach(function(id){
    hideIfBroken(document.getElementById(id));
  });

  ciela.addEventListener('error', function(){
    teacher.querySelector('.speaker').style.cssText =
      'position:static;width:clamp(52px,13vw,80px);height:clamp(52px,13vw,80px);font-size:clamp(24px,6vw,36px)';
  });

  var bgProbe = new Image();
  bgProbe.onload = function(){ stage.classList.add('has-bg'); };
  bgProbe.src = 'backgroundPlate.png';

  /* ==========================================================
     Sound
     ========================================================== */

  var muted = false;
  var clips = {};
  var audioReport = [];

  function tone(freqs, type, peak){
    if(muted) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      freqs.forEach(function(f, i){
        var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        var t0 = audioCtx.currentTime + i * 0.09;
        osc.type = type; osc.frequency.value = f;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + 0.36);
      });
    }catch(e){}
  }

  /* Filenames don't follow one convention, so probe a few spellings with a
     HEAD request. Higgsfield exports .wav, hand-added files are .mp3 — both
     are checked. Media events can't be trusted here: phone browsers often
     refuse to preload audio, so canplaythrough may never fire. */
  function candidates(stem){
    return [
      stem + '.mp3',
      stem + '.wav',
      'audio' + stem + '.mp3',
      'audio' + stem + '.wav',
      'audio/' + stem + '.mp3',
      'audio/' + stem + '.wav'
    ];
  }

  function findFile(stem, done){
    var names = candidates(stem), i = 0;
    (function next(){
      if(i >= names.length){ audioReport.push(stem + ': -'); done(null); return; }
      fetch(names[i], { method:'HEAD', cache:'no-store' })
        .then(function(r){
          if(r.ok){ audioReport.push(stem + ' -> ' + names[i]); done(names[i]); }
          else { i++; next(); }
        })
        .catch(function(){ i++; next(); });
    })();
  }

  function loadClip(key, stem){
    findFile(stem, function(url){
      if(!url) return;
      var a = new Audio(url);
      a.preload = 'auto';
      clips[key] = a;
    });
  }

  (function loadAll(){
    var i;
    for(i = 1; i <= 10; i++) loadClip('find-' + i, 'find-' + i);
    for(i = 1; i <= 6; i++) loadClip('cheer-' + i, 'cheer-' + i);
    loadClip('win', 'win');
    loadClip('stones-go', 'stones-go');
    ['calm-how','calm-slow','calm-in','calm-out','calm-five','calm-what','calm-help','calm-end']
      .forEach(function(k){ loadClip(k, k); });
    for(i = 1; i <= 10; i++) loadClip('num-' + i, 'num-' + i);
    for(i = 1; i <= 4; i++) loadClip('yay-' + i, 'yay-' + i);
    for(i = 1; i <= 3; i++) loadClip('retry-' + i, 'retry-' + i);
    CRYSTAL_COLOURS.forEach(function(c){ loadClip('crystal-' + c.key, 'crystal-' + c.key); });
    loadClip('correct', 'correct');
    loadClip('wrong', 'wrong');
    for(i = 0; i < SHAPES.length; i++) loadClip('shape-' + SHAPES[i].key, 'shape-' + SHAPES[i].key);
    for(i = 0; i < COLORS.length; i++) loadClip('color-' + COLORS[i].key, 'color-' + COLORS[i].key);
    ALPHABET.forEach(function(L){ loadClip('letter-' + L, 'letter-' + L.toLowerCase()); });
    BRIDGE_LEVELS.forEach(function(lv){

      if(i >= steps){
        clearInterval(timer);
        if(thenStop){ el.pause(); el.currentTime = 0; }
      }
    }, 40);
  }

  function record(mKey, itemKey, correct){
    if(!mKey || !itemKey) return;
    if(!progress[mKey]) progress[mKey] = {};
    var slot = progress[mKey][itemKey] || { right:0, wrong:0 };
    if(correct) slot.right++; else slot.wrong++;
    progress[mKey][itemKey] = slot;

    if(key.indexOf('stones-') === 0) return stoneLevelById(key.slice(7)).puzzles.map(function(q){ return q.id; });

  /* ==========================================================
     Adaptive round planning

     A child who already knows 1-10 shouldn't sit through all ten
     every time. Once there is history for a mode, rounds are drawn
     toward the items they miss, with mastered items still appearing
     often enough to keep it winnable. With no history yet, the mode's
     natural teaching order is used instead.
     ========================================================== */

  function keyOfItem(mKey, item){
    if(mKey === 'letters')   return item.letter;
    if(mKey === 'lowercase') return item.letter.toLowerCase();
    if(item && typeof item === 'object') return item.key;
    return String(item);
  }

  function weightOf(mKey, item){
    var slot = (progress[mKey] || {})[keyOfItem(mKey, item)];
    if(!slot) return 4;                       /* never seen - introduce it */
    if(slot.wrong > slot.right) return 6;     /* getting it wrong a lot    */
    if(slot.wrong > 0) return 3;              /* shaky                     */
    if(slot.right >= 3) return 1;             /* solid - keep it rare      */
    return 2;                                 /* right, but not yet proven */
  }

  function weightedPick(mKey, pool, avoid){
    var weights = [], total = 0;
    pool.forEach(function(item){
      var w = (item === avoid) ? 0 : weightOf(mKey, item);
      weights.push(w);
      total += w;
    });
    if(total <= 0) return pool[Math.floor(Math.random() * pool.length)];
    var roll = Math.random() * total, acc = 0;
    for(var i = 0; i < pool.length; i++){
      acc += weights[i];
      if(roll <= acc) return pool[i];
    }
    return pool[pool.length - 1];
  }

  function adaptivePlan(mKey, pool, count, keepOrder){
    var seen = progress[mKey] || {};
    var hasHistory = Object.keys(seen).length > 0;

    if(!hasHistory){
      var fresh = pool.slice();
      if(!keepOrder) shuffle(fresh);
      return fresh.slice(0, count);
    }

    /* anything never seen goes in first, so new material still arrives */
    var unseen = pool.filter(function(it){ return !seen[keyOfItem(mKey, it)]; });
    shuffle(unseen);
    var picks = unseen.slice(0, Math.ceil(count / 2));

    var last = picks.length ? picks[picks.length - 1] : null;
    var guard = 0;
    while(picks.length < count && guard++ < 300){
      var choice = weightedPick(mKey, pool, last);
      picks.push(choice);
      last = choice;
    }

    shuffle(picks);

    /* no item twice in a row - a repeat reads as a glitch to a small child */
    for(var i = 1; i < picks.length; i++){
      if(picks[i] === picks[i - 1]){
        for(var j = i + 1; j < picks.length; j++){
          if(picks[j] !== picks[i - 1]){
            var t = picks[i]; picks[i] = picks[j]; picks[j] = t;
            break;
          }
        }
      }
    }
    return picks;
  }

  /* ==========================================================
     Round engine
     ========================================================== */

  function currentTarget(){ return rounds[index]; }

  function answerValue(){
    return mode.answer ? mode.answer.call(mode, currentTarget()) : currentTarget();
  }

  function matches(a, b){
    return mode.same ? mode.same.call(mode, a, b) : a === b;
  }

  function newRound(){
    stopVoice();
    busy = false;
    field.classList.remove('locked');
    field.innerHTML = '';

    var target = currentTarget();
    if(mode.before) mode.before.call(mode, target);

    prompt.innerHTML = mode.prompt.call(mode, target);
    prompt.classList.add('pulse');
    setTimeout(function(){ prompt.classList.remove('pulse'); }, 320);

    var options = mode.choices.call(mode, target, index + 1);

    if(mode.layout === 'count') renderCounting(target, options);
    else renderFloating(options);

    setTimeout(speakPrompt, 340);
  }

  function renderFloating(options){
    options.forEach(function(value, i){
      var b = mode.render.call(mode, value);
      floatify(b, i, options.length);
      b.addEventListener('click', function(){ judge(value, b); });
      field.appendChild(b);
    });
  }

  function renderCounting(target, options){
    var wrap = document.createElement('div');
    wrap.className = 'count-wrap';

    var tray = document.createElement('div');
    tray.className = 'count-tray';
    var itemSize = target <= 4 ? 'clamp(52px,15vw,120px)'
                 : target <= 6 ? 'clamp(44px,12vw,96px)'
                 : 'clamp(36px,10vw,78px)';

    for(var k = 0; k < target; k++){
      var img = document.createElement('img');
      img.src = mode.prop.file;
      img.alt = '';
      img.style.setProperty('--item', itemSize);
      img.style.setProperty('--dur', (2.4 + Math.random() * 1.6).toFixed(2) + 's');
      img.style.setProperty('--delay', (Math.random() * 1.2).toFixed(2) + 's');
      tray.appendChild(img);
    }

    var row = document.createElement('div');
    row.className = 'count-row';
    options.forEach(function(value){
      var b = mode.render.call(mode, value);
      b.style.setProperty('--size', 'clamp(52px,15vw,116px)');
      b.addEventListener('click', function(){ judge(value, b); });
      row.appendChild(b);
    });

    wrap.appendChild(tray);
    wrap.appendChild(row);
    field.appendChild(wrap);
  }

  /* ==========================================================
     Chispa's memory cards
     ========================================================== */

  var deckState = null;

  function deckPool(){
    /* Ciela's own objects only - pictures are what makes a memory game
       readable at a glance for a small child. */
    return PROPS.map(function(pr){
      return { id:'obj-' + pr.key, kind:'img', src:pr.file, label:pr.one };
    });
  }

  function cardFace(item){
    var face = document.createElement('span');
    face.className = 'card-face card-front';
    if(item.kind === 'img'){
      var img = document.createElement('img');
      img.src = item.src;
      img.alt = '';
      img.addEventListener('error', function(){
        var g = document.createElement('span');
        g.className = 'face-glyph';
        g.textContent = item.label.charAt(0).toUpperCase();
        img.replaceWith(g);
      });
      face.appendChild(img);
    }else{
      var g2 = document.createElement('span');
      g2.className = 'face-glyph';
      g2.textContent = item.text;
      face.appendChild(g2);
    }
    return face;
  }

  function cardBack(){
    var back = document.createElement('span');
    back.className = 'card-face card-back';
    var img = document.createElement('img');
    img.src = 'chispa-curious.png';
    img.alt = '';
    img.addEventListener('error', function(){
      var paw = document.createElement('span');
      paw.className = 'paw';
      paw.textContent = '\uD83D\uDC3E';
      img.replaceWith(paw);
    });
    back.appendChild(img);
    return back;
  }

  /* Choose rows x cols so the cells come out closest to a portrait card
     shape in the space actually available. Works in both orientations. */
  function bestGrid(count, w, h){
    /* Columns are capped so a wide screen never turns the deck into one
       long strip of tall thin cards. A part-filled last row is fine. */
    var best = null;
    var maxCols = Math.min(count, 6);
    for(var c = 2; c <= maxCols; c++){
      var r = Math.ceil(count / c);
      var cell = (w / c) / (h / r);          /* resulting cell aspect */
      var gaps = c * r - count;              /* empty trailing cells      */
      var score = Math.abs(Math.log(cell / 0.85)) + gaps * 0.06;
      if(!best || score < best.score) best = { cols:c, rows:r, score:score };
    }
    return best || { cols:4, rows:Math.ceil(count / 4) };
  }

  var MAX_CELL = 200;   /* a card never needs to be bigger than this */

  function layoutDeck(){
    var st = deckState;
    if(!st || !st.deck || !st.wrap) return;

    var box = st.wrap.getBoundingClientRect();
    var w = box.width, h = box.height;

    /* If the browser hasn't laid the field out yet the box is zero. Measuring
       then would pick a nonsense grid and blow the cards up, so wait a frame
       and try again rather than guessing. */
    if(w < 40 || h < 40){
      requestAnimationFrame(layoutDeck);
      return;
    }

    var g = bestGrid(st.count, w, h);
    st.deck.style.setProperty('--cols', g.cols);
    st.deck.style.setProperty('--rows', g.rows);

    var gap = Math.max(4, Math.min(12, w * 0.012));
    var cellW = (w - gap * (g.cols - 1)) / g.cols;
    var cellH = (h - gap * (g.rows - 1)) / g.rows;
    var cell = Math.min(cellW, cellH, MAX_CELL);

    /* cap the whole board so cards stay card-sized on a big screen */
    st.deck.style.maxWidth  = Math.ceil(cell * g.cols + gap * (g.cols - 1)) + 'px';
    st.deck.style.maxHeight = Math.ceil(cell * g.rows + gap * (g.rows - 1)) + 'px';
  }

  var relayoutTimer = null;
  function scheduleRelayout(){
    clearTimeout(relayoutTimer);
    relayoutTimer = setTimeout(layoutDeck, 100);
  }
  window.addEventListener('resize', function(){
    if(stoneState && stoneState.stream){
      moveWalker(stoneState.stream, stoneState.walker,
                 stoneState.given + stoneState.placed);
    }
  });
  window.addEventListener('resize', scheduleRelayout);
  window.addEventListener('orientationchange', scheduleRelayout);
  if(window.ResizeObserver){
    new ResizeObserver(scheduleRelayout).observe(field);
  }

  function buildDeck(pairs){
    stopVoice();
    field.innerHTML = '';
    prompt.innerHTML = '<span>Find the matching pairs</span>';

    var chosen = shuffle(deckPool()).slice(0, pairs);
    var cards = [];
    chosen.forEach(function(item){
      cards.push(item);
      cards.push(item);
    });
    shuffle(cards);

    var wrap = document.createElement('div');
    wrap.className = 'deck-wrap';
    var deck = document.createElement('div');
    deck.className = 'deck';
    wrap.appendChild(deck);

    deckState = { open:[], found:0, pairs:pairs, count:cards.length,
                  busy:false, deck:deck, wrap:wrap };

    cards.forEach(function(item){
      var btn = document.createElement('button');
      btn.className = 'card';
      btn.type = 'button';
      btn.setAttribute('aria-label', 'face down card');
      var inner = document.createElement('span');
      inner.className = 'card-inner';
      inner.appendChild(cardBack());
      inner.appendChild(cardFace(item));
      btn.appendChild(inner);
      btn.addEventListener('click', function(){ flipCard(btn, item); });
      deck.appendChild(btn);
    });

    field.appendChild(wrap);
    requestAnimationFrame(layoutDeck);
  }

  function flipCard(btn, item){
    var st = deckState;
    if(!st || st.busy) return;
    if(btn.classList.contains('flipped') || btn.classList.contains('matched')) return;

    btn.classList.add('flipped');
    btn.setAttribute('aria-label', item.label);
    st.open.push({ btn:btn, item:item });
    if(st.open.length < 2) return;

    var a = st.open[0], b = st.open[1];
    st.open = [];

    if(a.item.id === b.item.id){
      chime();
      a.btn.classList.add('matched');
      b.btn.classList.add('matched');
      st.found++;
      lightGems(gemRow, st.found);
      react('cheer');
      setTimeout(function(){
        a.btn.classList.add('settled');
        b.btn.classList.add('settled');
      }, 700);
      if(st.found >= st.pairs){
        st.busy = true;
        setTimeout(function(){
          var key = randomCheerKey();
          if(key) playClip(key);
        }, 260);
        setTimeout(finish, 1400);
      }
      return;
    }

    /* no match - hold both face up long enough to be seen, then turn back */
    st.busy = true;
    st.deck.classList.add('locked');
    thud();
    react('nudge');
    setTimeout(function(){
      a.btn.classList.remove('flipped');
      b.btn.classList.remove('flipped');
      a.btn.setAttribute('aria-label', 'face down card');
      b.btn.setAttribute('aria-label', 'face down card');
      st.busy = false;
      st.deck.classList.remove('locked');
    }, 1100);
  }

  /* ==========================================================
     Calm-Down Clouds

     Deliberately slow. No timer, no score, no wrong answer, and
     nothing here is stored about how a child said they felt.
     ========================================================== */

  var calmState = null;
  var calmNoise = null;
  var calmLook = false;   /* true while the pair are sitting in lotus */

  var NORMAL_LOOK = { ciela:'cielaBust.png', chispa:'chispa-content.png' };
  var CALM_LOOK   = { ciela:'ciela-calm.png', chispa:'chispa-calm.png' };

  function setCrewLook(calm){
    calmLook = !!calm;
    var look = calm ? CALM_LOOK : NORMAL_LOOK;
    if(ciela && !ciela.hidden)   ciela.src  = look.ciela;
    if(chispa && !chispa.hidden) chispa.src = look.chispa;
  }

      '<circle cx="35" cy="48" r="5.5" fill="#2C4450"/><circle cx="65" cy="48" r="5.5" fill="#2C4450"/>' +
      '<g stroke="#2C4450" stroke-width="4.5" stroke-linecap="round" fill="none">' +
      '<path d="' + f.brow + '"/><path d="' + f.brow2 + '"/><path d="' + f.mouth + '"/>' +
      '</g></svg>';
  }

    var edge = storm ? '#6B7C86' : '#CFEDF1';

  function stickerSVG(key){

    var art = {
      cloud:'<g fill="#FFFFFF" stroke="#7FC7DA" stroke-width="4"><circle cx="36" cy="56" r="18"/>'+

          '<circle cx="41" cy="47" r="3.5" fill="#8A6A16"/><circle cx="59" cy="47" r="3.5" fill="#8A6A16"/>'+

          '<path d="M26 76 A24 24 0 0 1 74 76" stroke="#F5CE3F"/>'+
          '<path d="M38 76 A12 12 0 0 1 62 76" stroke="#4CB963"/></g>',
      drop:'<path d="M50 10 C68 40 78 52 78 64 A28 28 0 0 1 22 64 C22 52 32 40 50 10 Z" '+
           'fill="#7FC7DA" stroke="#3C8BE4" stroke-width="4"/>'+
           '<circle cx="40" cy="62" r="6" fill="rgba(255,255,255,.75)"/>',
      star:'<path d="M50 8 L62 38 L94 41 L69 61 L78 92 L50 74 L22 92 L31 61 L6 41 L38 38 Z" '+
           'fill="#F5CE3F" stroke="#E8B75A" stroke-width="4" stroke-linejoin="round"/>',
      moon:'<path d="M62 12 A40 40 0 1 0 62 88 A32 32 0 0 1 62 12 Z" fill="#FBE39B" '+
