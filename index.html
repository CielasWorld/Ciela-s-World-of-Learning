           '<path d="M40 50 Q46 56 52 50" stroke="#B08B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
    }[key] || '';
    return open + art + '</svg>';
  }

  function haveStickers(){
    var v = progress.stickers;
    return (v && typeof v === 'object') ? v : {};
  }

  function awardSticker(){
    var have = haveStickers();
    var left = STICKERS.filter(function(t){ return !have[t.key]; });
    if(!left.length) return null;
    var pick = left[Math.floor(Math.random() * left.length)];
    have[pick.key] = true;
    progress.stickers = have;
    saveProgress();
    return pick;
  }

  function calmSay(text){
    var el = calmState && calmState.say;
    if(el) el.textContent = text;
  }

  function calmScreen(){
    field.innerHTML = '';
    prompt.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'calm';
    var say = document.createElement('p');
    say.className = 'calm-say';
    box.appendChild(say);
    field.appendChild(box);
    if(calmState){ calmState.box = box; calmState.say = say; }
    return box;
  }

  function startCalm(){
    stopCalmNoise();
    setCrewLook(true);
    calmState = { breaths:0 };
    buildGems(gemRow, 0);
    askFeeling();
  }

  /* 1 - name the feeling. Nothing here is recorded. */
  function askFeeling(){
    var box = calmScreen();
    calmSay('How are you feeling?');
    playClip('calm-how');

    var row = document.createElement('div');
    row.className = 'faces';
    FEELINGS.forEach(function(f){
      var b = document.createElement('button');
      b.className = 'face'; b.type = 'button';
      b.innerHTML = faceSVG(f) + '<span>' + f.name + '</span>';
      b.setAttribute('aria-label', f.name);
      b.addEventListener('click', function(){
        calmState.feeling = f;
        beginBreathing();
      });
      row.appendChild(b);
    });
    box.appendChild(row);
  }

  /* 2 - five slow breaths */
  function beginBreathing(){
    var box = calmScreen();
    calmSay('Big feelings are okay. Let us slow down together.');
    playClip('calm-slow');

    var stage = document.createElement('div');
    stage.className = 'breath-stage';
    var cloud = document.createElement('div');
    cloud.className = 'breath-cloud';
    cloud.innerHTML = cloudSVG(true);
    stage.appendChild(cloud);

    var dots = document.createElement('div');
    dots.className = 'breath-dots';
    for(var i = 0; i < 5; i++){
      var d = document.createElement('span');
      d.className = 'bdot';
      dots.appendChild(d);
    }

    box.appendChild(stage);
    box.appendChild(dots);

    chispaFace('rest');
    calmState.cloud = cloud;
    calmState.dots = dots;
    calmState.breaths = 0;

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    /* Unhurried on purpose: a four-second in-breath is the point of the
       exercise, and the pause between breaths is where a child settles. */
    var IN    = reduce ? 1600 : 5000;
    var HOLD  = reduce ?  600 : 1600;
    var OUT   = reduce ? 2000 : 6000;
    var REST  = reduce ?  700 : 2200;

    cloud.style.transitionDuration = (IN / 1000) + 's';

    setTimeout(function breathe(){
      if(!calmState || calmState.stopped) return;
      calmSay('Breathe in while the cloud grows.');
      playClip('calm-in');
      cloud.style.transitionDuration = (IN / 1000) + 's';
      cloud.classList.add('inhale');

      setTimeout(function(){
        if(!calmState || calmState.stopped) return;
        /* a quiet moment at the top of the breath */
        calmSay('\u2026');

        setTimeout(function(){
          if(!calmState || calmState.stopped) return;
          calmSay('Now breathe out while it becomes smaller.');
          playClip('calm-out');
          cloud.style.transitionDuration = (OUT / 1000) + 's';
          cloud.classList.remove('inhale');

          setTimeout(function(){
            if(!calmState || calmState.stopped) return;
            calmState.breaths++;
            var lit = dots.children[calmState.breaths - 1];
            if(lit) lit.classList.add('on');

            if(calmState.breaths >= 5){
              calmSay('We took five slow breaths!');
              playClip('calm-five');
              react('cheer');
              setTimeout(chooseActivity, 2400);
            }else{
              calmSay('\u2026');
              setTimeout(breathe, REST);
            }
          }, OUT);
        }, HOLD);
      }, IN);
    }, 2600);
  }

  /* 3 - pick something calming */
  function chooseActivity(){
    var box = calmScreen();
    calmSay('Wonderful! Now, what could help us feel calmer?');
    playClip('calm-what');

    var grid = document.createElement('div');
    grid.className = 'acts';
    CALM_ACTS.forEach(function(a){
      var b = document.createElement('button');
      b.className = 'act'; b.type = 'button';
      b.innerHTML = '<span class="act-ico">' + a.ico + '</span>' +
                    '<span class="act-name">' + a.name + '</span>';
      b.addEventListener('click', function(){ runActivity(a.key); });
      grid.appendChild(b);
    });
    box.appendChild(grid);
  }

  function calmDoneButton(box, label){
    var b = document.createElement('button');
    b.className = 'go';
    b.type = 'button';
    b.textContent = label || 'All done';
    b.addEventListener('click', finishCalm);
    box.appendChild(b);
  }

  function runActivity(key){
    stopCalmNoise();
    var box = calmScreen();

    if(key === 'corner'){
      calmSay("Make Chispa a cosy corner. Drag each thing onto the rug.");
      var scene = document.createElement('div');
      scene.className = 'corner';
      var tray = document.createElement('div');
      tray.className = 'tray';
      var placed = 0;

      function sceneBox(){ return scene.getBoundingClientRect(); }

      function makePiece(item, xPct, yPct){
        var img = document.createElement('img');
        img.className = 'cosy pop';
        img.src = item.file;
        img.alt = item.name;
        img.style.left = xPct + '%';
        img.style.top = yPct + '%';
        img.style.setProperty('--cw', Math.round(sceneBox().width * item.w) + 'px');
        img.addEventListener('error', function(){ img.remove(); });

        var dragging = false, offX = 0, offY = 0;
        img.addEventListener('pointerdown', function(e){
          dragging = true;
          img.setPointerCapture(e.pointerId);
          var b = sceneBox(), r = img.getBoundingClientRect();
          offX = e.clientX - (r.left + r.width / 2);
          offY = e.clientY - (r.top + r.height / 2);
          e.preventDefault();
        });
        img.addEventListener('pointermove', function(e){
          if(!dragging) return;
          var b = sceneBox();
          /* keep it on the rug rather than floating off into the sky */
          var x = ((e.clientX - offX - b.left) / b.width) * 100;
          var y = ((e.clientY - offY - b.top) / b.height) * 100;
          img.style.left = Math.max(10, Math.min(80, x)) + '%';
          img.style.top  = Math.max(40, Math.min(88, y)) + '%';
        });
        function drop(){ dragging = false; }
        img.addEventListener('pointerup', drop);
        img.addEventListener('pointercancel', drop);

        scene.appendChild(img);
      }

      COSY.forEach(function(item){
        var b = document.createElement('button');
        b.className = 'tray-item';
        b.type = 'button';
        b.setAttribute('aria-label', 'add the ' + item.name);
        var thumb = document.createElement('img');
        thumb.src = item.file;
        thumb.alt = '';
        thumb.addEventListener('error', function(){ b.textContent = item.name; });
        b.appendChild(thumb);
        b.addEventListener('click', function(){
          if(b.classList.contains('done')) return;
          b.classList.add('done');
          makePiece(item, item.at[0], item.at[1]);
          chime();
          placed++;
          if(placed >= COSY.length){
            calmSay('Chispa has somewhere soft to rest. You can move things around.');
            react('cheer');
            calmDoneButton(box);
          }else{
            calmSay('Lovely. What else should Chispa have?');
          }
        });
        tray.appendChild(b);
      });

      box.appendChild(scene);
      box.appendChild(tray);
      return;
    }

    if(key === 'stretch'){
      calmSay('Copy Ciela. Hold each stretch slowly.');
      var stage = document.createElement('div');
      stage.className = 'stretch-stage';
      var poseImg = document.createElement('img');
      poseImg.alt = '';
      poseImg.addEventListener('error', function(){ poseImg.style.visibility = 'hidden'; });
      stage.appendChild(poseImg);

      var ring = document.createElementNS('http://www.w3.org/2000/svg','svg');
      ring.setAttribute('class','hold-ring');
      ring.setAttribute('viewBox','0 0 40 40');
      ring.innerHTML =
        '<circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="5"/>' +
        '<circle cx="20" cy="20" r="16" fill="none" stroke="#E8B75A" stroke-width="5" ' +
        'stroke-linecap="round" transform="rotate(-90 20 20)" ' +
        'stroke-dasharray="100.5" stroke-dashoffset="100.5"/>';

      box.appendChild(stage);
      box.appendChild(ring);

      /* Leaning one way and not the other leaves a child lopsided, so the
         two side stretches always travel together and in order. */
      var sides = STRETCHES.filter(function(x){ return x.side; });
      var rest  = shuffle(STRETCHES.filter(function(x){ return !x.side; }));
      var picked = [rest[0]].concat(sides);
      var idx = 0;
      var arc = ring.querySelectorAll('circle')[1];
      var reduceS = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var HOLD = reduceS ? 3000 : 10000;

      (function doPose(){
        if(!calmState || calmState.stopped) return;
        var pose = picked[idx];
        poseImg.classList.add('swap');
        setTimeout(function(){
          if(!calmState || calmState.stopped) return;
          poseImg.src = pose.file;
          poseImg.style.visibility = '';
          poseImg.classList.remove('swap');
          calmSay(pose.say);
          playClip('num-' + (idx + 1));
        }, 700);

        var t0 = Date.now();
        var timer = setInterval(function(){
          if(!calmState || calmState.stopped){ clearInterval(timer); return; }
          var k = Math.min(1, (Date.now() - t0) / HOLD);
          arc.setAttribute('stroke-dashoffset', (100.5 * (1 - k)).toFixed(1));
          if(k >= 1){
            clearInterval(timer);
            idx++;
            if(idx >= picked.length){
              poseImg.src = 'ciela-cheer.png';
              calmSay('Three good stretches.');
              react('cheer');
              calmDoneButton(box);
            }else{
              arc.setAttribute('stroke-dashoffset', 100.5);
              doPose();
            }
          }
        }, 90);
      })();
      return;
    }

    if(key === 'stars'){
      calmSay('Tap each star slowly.');
      var row = document.createElement('div');
      row.className = 'star-row';
      var lit = 0;

  /* ---------- glitter jar ---------- */
  function startGlitter(cv){
    var ctx = cv.getContext('2d');
    var bits = [], raf = null;

    function fit(){
      var r = cv.getBoundingClientRect();
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.max(80, r.width * dpr);
      cv.height = Math.max(80, r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return r;
    }
    var box = fit();

    for(var i = 0; i < 130; i++){
      bits.push({ x:Math.random() * box.width, y:Math.random() * box.height,
                  vx:0, vy:0, r:1 + Math.random() * 2.6,
                  h:['#FFFFFF','#FBE39B','#BFF0F4','#E8B75A','#C7B6E6'][i % 5] });
    }

    function shake(){
      bits.forEach(function(b){
        b.vx = (Math.random() - 0.5) * 4.5;
        b.vy = (Math.random() - 1) * 4.5;
      });
    }

    function tick(){
      var r = cv.getBoundingClientRect();
      ctx.clearRect(0, 0, r.width, r.height);
      bits.forEach(function(b){
        b.vy += 0.018;                  /* very slow fall */
        b.vx *= 0.982; b.vy *= 0.985;
        b.x += b.vx; b.y += b.vy;
        if(b.x < 2){ b.x = 2; b.vx *= -0.4; }
        if(b.x > r.width - 2){ b.x = r.width - 2; b.vx *= -0.4; }
        if(b.y > r.height - 3){ b.y = r.height - 3; b.vy *= -0.22; b.vx *= 0.86; }
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = b.h;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.284); ctx.fill();
      });
      raf = requestAnimationFrame(tick);
    }

    cv.addEventListener('pointerdown', shake);
    window.addEventListener('resize', fit);
    shake(); tick();
    if(calmState) calmState.stopGlitter = function(){ if(raf) cancelAnimationFrame(raf); };
  }

  /* ---------- free drawing ---------- */
  function startDoodle(cv, pens){
    var ctx = cv.getContext('2d');
    var colours = ['#3C8BE4','#E4483C','#F5CE3F','#4CB963','#8B5FC9','#EC7BB0','#2C4450'];
    var cur = colours[0], drawing = false;

    function fit(){
      var r = cv.getBoundingClientRect();
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var snap = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
      cv.width = Math.max(80, r.width * dpr);
      cv.height = Math.max(80, r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if(snap) try{ ctx.putImageData(snap, 0, 0); }catch(e){}
    }
    fit();
    window.addEventListener('resize', fit);

    colours.forEach(function(c, i){
      var b = document.createElement('button');
      b.className = 'pen' + (i === 0 ? ' on' : '');
      b.type = 'button';
      b.style.background = c;
      b.setAttribute('aria-label', 'colour');
      b.addEventListener('click', function(){
        cur = c;
        pens.querySelectorAll('.pen').forEach(function(o){ o.classList.remove('on'); });
        b.classList.add('on');
      });
      pens.appendChild(b);
    });

    var clear = document.createElement('button');
    clear.className = 'pen';
    clear.type = 'button';
    clear.style.background = '#fff';
    clear.textContent = '\u21ba';
    clear.setAttribute('aria-label', 'start again');
    clear.addEventListener('click', function(){
      var r = cv.getBoundingClientRect();
      ctx.clearRect(0, 0, r.width, r.height);
    });
    pens.appendChild(clear);

    function pos(e){
      var r = cv.getBoundingClientRect();
      return { x:e.clientX - r.left, y:e.clientY - r.top };
    }
    cv.addEventListener('pointerdown', function(e){
      drawing = true;
      cv.setPointerCapture(e.pointerId);
      var p = pos(e);
      ctx.strokeStyle = cur; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
    });
    cv.addEventListener('pointermove', function(e){
      if(!drawing) return;
      var p = pos(e);
      ctx.lineTo(p.x, p.y); ctx.stroke();
    });
    cv.addEventListener('pointerup', function(){ drawing = false; });
    cv.addEventListener('pointercancel', function(){ drawing = false; });
  }

  /* ---------- gentle soundscapes, synthesised so nothing extra loads ---------- */
  function startCalmNoise(kind){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();

      var len = audioCtx.sampleRate * 2;
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      var last = 0;
      for(var i = 0; i < len; i++){
        var white = Math.random() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;      /* brown-ish noise, soft */
        d[i] = last * 3.2;
      }
      var src = audioCtx.createBufferSource();
      src.buffer = buf; src.loop = true;

      var filt = audioCtx.createBiquadFilter();
      var gain = audioCtx.createGain();
      gain.gain.value = 0;

      if(kind === 'rain'){ filt.type = 'highpass'; filt.frequency.value = 900; }
      else if(kind === 'waterfall'){ filt.type = 'lowpass'; filt.frequency.value = 1600; }
      else if(kind === 'wind'){ filt.type = 'bandpass'; filt.frequency.value = 420; filt.Q.value = 0.7; }
      else { filt.type = 'lowpass'; filt.frequency.value = 3000; }

      src.connect(filt).connect(gain).connect(audioCtx.destination);
      src.start();
      gain.gain.linearRampToValueAtTime(kind === 'chimes' ? 0.05 : 0.12, audioCtx.currentTime + 1.5);

      var chime = null;
      if(kind === 'chimes'){
        var notes = [523.25, 587.33, 698.46, 783.99, 880];
        chime = setInterval(function(){
          if(muted) return;
          var o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = 'sine';
          o.frequency.value = notes[Math.floor(Math.random() * notes.length)];
          var t0 = audioCtx.currentTime;
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(0.07, t0 + 0.05);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
          o.connect(g).connect(audioCtx.destination);
          o.start(t0); o.stop(t0 + 2.5);
        }, 2600);
      }

      calmNoise = { src:src, gain:gain, chime:chime };
    }catch(e){ calmNoise = null; }
  }

  function stopCalmNoise(){
    if(!calmNoise) return;
    try{
      if(calmNoise.chime) clearInterval(calmNoise.chime);
      calmNoise.gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
      var s = calmNoise.src;
      setTimeout(function(){ try{ s.stop(); }catch(e){} }, 600);
    }catch(e){}
    calmNoise = null;
  }

  /* ==========================================================
     Count Ciela's Crystals

     The point of this one is one-to-one correspondence: every crystal
     gets exactly one number word. That is why the child taps each stone
     and hears it counted before any numeral is offered.
     ========================================================== */

  var crystalState = null;
  var gradSeq = 0;

  function crystalSVG(c){
    var id = 'cg' + (++gradSeq);
    return '<svg viewBox="0 0 100 132" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0.4" y2="1">' +
      '<stop offset="0%" stop-color="#FFFFFF"/><stop offset="22%" stop-color="' + c.hi + '"/>' +
      '<stop offset="62%" stop-color="' + c.mid + '"/><stop offset="100%" stop-color="' + c.low + '"/>' +
      '</linearGradient></defs>' +
      '<g stroke="#E8B75A" stroke-width="4" stroke-linejoin="round">' +
      '<path fill="url(#' + id + ')" d="M50 4 L86 40 L64 126 L36 126 L14 40 Z"/>' +
      '<path fill="rgba(255,255,255,.30)" stroke="none" d="M50 4 L86 40 L50 52 Z"/>' +
      '<path fill="rgba(0,0,0,.13)" stroke="none" d="M50 52 L86 40 L64 126 Z"/>' +
      '</g></svg>';
  }

  function crystalsMastered(){
    var seen = progress.crystals || {}, n = 0;
    for(var i = 1; i <= 10; i++) if(seen[i] && seen[i].right > 0) n++;
    return n;
  }

  function startCrystals(){
    var pool = numberPool();
    var plan = adaptivePlan('crystals', pool, mode.roundsPerGame, true);
    /* once every number is solid, rounds mix colours instead */
    crystalState = { list:plan, at:0, mixed:crystalsMastered() >= 10, earned:[] };
    buildGems(gemRow, plan.length);
    nextGarden();
  }

  function sizeGarden(count){
    var box = field.getBoundingClientRect();
    var w = Math.max(160, box.width), h = Math.max(160, box.height);
    var per = Math.ceil(Math.sqrt(count * (w / Math.max(1, h))));
    var size = Math.min(w / (per + 0.6), h / (Math.ceil(count / Math.max(1, per)) + 1.4), 108);
    var pick = Math.min(w / 5, h * 0.2, 82);
    return { size:Math.max(34, size), pick:Math.max(44, pick) };
  }

  function nextGarden(){
    stopVoice();
    var st = crystalState;
    if(!st) return;

    var target = st.list[st.at];
    var colour = CRYSTAL_COLOURS[Math.floor(Math.random() * CRYSTAL_COLOURS.length)];
    st.target = target;
    st.colour = colour;
    st.counted = 0;
    st.clean = true;
    st.answered = false;

    field.innerHTML = '';
    prompt.innerHTML = '<span>Count the <em>' + colour.name + '</em> crystals</span>';

    var garden = document.createElement('div');
    garden.className = 'garden';
    var plot = document.createElement('div');
    plot.className = 'garden-field';

    /* Color Count: distractor crystals in other colours, only the
       target colour is to be counted */
    var others = [];
    if(st.mixed){
      var otherPool = CRYSTAL_COLOURS.filter(function(c){ return c.key !== colour.key; });
      var extra = 2 + Math.floor(Math.random() * 3);
      for(var e = 0; e < extra; e++){
        others.push(otherPool[Math.floor(Math.random() * otherPool.length)]);
      }
    }

    var total = target + others.length;
    var sz = sizeGarden(total);
    var slots = shuffle(scatterSlots(total));

    var made = 0;
    function addCrystal(c, isTarget){
      var b = document.createElement('button');
      b.className = 'crystal';
      b.type = 'button';
      b.innerHTML = crystalSVG(c);
      b.setAttribute('aria-label', c.name + ' crystal');
      b.style.setProperty('--size', sz.size.toFixed(0) + 'px');
      var pos = slots[made++];
      b.style.left = pos.x + '%';
      b.style.top = pos.y + '%';
      b.style.setProperty('--dur', (2.6 + Math.random() * 1.8).toFixed(2) + 's');
      b.style.setProperty('--delay', (Math.random() * 1.4).toFixed(2) + 's');
      b.style.setProperty('--tilt', (Math.random() * 8 - 4).toFixed(1) + 'deg');
      b.addEventListener('click', function(){ tapCrystal(b, isTarget); });
      plot.appendChild(b);
    }

    for(var i = 0; i < target; i++) addCrystal(colour, true);
    others.forEach(function(c){ addCrystal(c, false); });

    var ask = document.createElement('div');
    ask.className = 'garden-ask';
    ask.hidden = true;

    garden.appendChild(plot);
    garden.appendChild(ask);
    field.appendChild(garden);

    st.plot = plot; st.ask = ask; st.size = sz;
    setTimeout(function(){ playClip('crystal-' + colour.key); }, 320);
  }

  /* spread positions on a loose grid so crystals never sit on top of each other */
  function scatterSlots(n){
    var cols = Math.ceil(Math.sqrt(n * 1.4)) || 1;
    var rows = Math.ceil(n / cols);
    var out = [];
    for(var r = 0; r < rows; r++){
      for(var c = 0; c < cols && out.length < n; c++){
        out.push({
          x: ((c + 0.5) / cols) * 76 + 12 + (Math.random() * 6 - 3),
          y: ((r + 0.5) / rows) * 68 + 16 + (Math.random() * 6 - 3)
        });
      }
    }
    return out;
  }

  function tapCrystal(btn, isTarget){
    var st = crystalState;
    if(!st || st.answered) return;
    if(btn.classList.contains('counted')) return;

    if(!isTarget){
      /* a wrong-colour crystal: no penalty, just a nudge */
      st.clean = false;
      btn.classList.remove('nope');
      void btn.offsetWidth;
      btn.classList.add('nope');
      thud();
      return;
    }

    st.counted++;
    btn.classList.add('counted');
    btn.setAttribute('data-n', st.counted);
    sparkle(btn);
    playClip('num-' + st.counted);

    if(st.counted >= st.target) setTimeout(showChoices, 700);
  }

  function showChoices(){
    var st = crystalState;
    if(!st || st.answered) return;

    var choices = [st.target];
    var guard = 0;
    while(choices.length < 3 && guard++ < 200){
      var d = st.target + (Math.random() < 0.5 ? -1 : 1) * (1 + Math.floor(Math.random() * 2));
      if(d >= 1 && d <= 12 && choices.indexOf(d) === -1) choices.push(d);
    }
    shuffle(choices);

    st.ask.innerHTML = '';
    choices.forEach(function(n){
      var b = document.createElement('button');
      b.className = 'numpick';
      b.type = 'button';
      b.textContent = n;
      b.setAttribute('aria-label', WORDS[n] || String(n));
      b.style.setProperty('--pick', st.size.pick.toFixed(0) + 'px');
      b.addEventListener('click', function(){ answerCount(n, b); });
      st.ask.appendChild(b);
    });
    st.ask.hidden = false;
    prompt.innerHTML = '<span>How many did you count?</span>';
  }

  function answerCount(n, btn){
    var st = crystalState;
    if(!st || st.answered) return;

    if(n !== st.target){
      st.clean = false;
      thud();
      btn.classList.remove('nope');
      void btn.offsetWidth;
      btn.classList.add('nope');
      react('nudge');
      prompt.innerHTML = '<span>' + CRYSTAL_TRY[Math.floor(Math.random() * CRYSTAL_TRY.length)] + '</span>';
      playClip('retry-' + (1 + Math.floor(Math.random() * CRYSTAL_TRY.length)));
      return;
    }

    st.answered = true;
    st.ask.classList.add('locked');
    chime();
    react('cheer');
    record('crystals', String(st.target), st.clean);
    if(st.clean) st.earned = st.earned.concat(addStars(1));
    lightGems(gemRow, st.at + 1);
    prompt.innerHTML = '<span>' + CRYSTAL_WIN[Math.floor(Math.random() * CRYSTAL_WIN.length)] + '</span>';
    setTimeout(function(){ playClip('yay-' + (1 + Math.floor(Math.random() * CRYSTAL_WIN.length))); }, 280);

    /* crystals fly off to the chest */
    var flyers = st.plot.querySelectorAll('.crystal.counted');
    for(var i = 0; i < flyers.length; i++){
      (function(el, k){
        setTimeout(function(){
          el.style.setProperty('--fx', '38vw');
          el.style.setProperty('--fy', '26vh');
          el.classList.add('flyaway');
        }, 90 * k);
      })(flyers[i], i);
    }

    setTimeout(function(){
      st.at++;
      if(st.at >= st.list.length) finishCrystals();
      else nextGarden();
    }, 1900);
  }

  function finishCrystals(){
    var st = crystalState;
    winTitle.textContent = mode.done;
    buildGems(trophy, st.list.length);
    lightGems(trophy, st.list.length);
    showPrize(st.earned.concat(addStars(1)));
    refreshChest();
    winVeil.hidden = false;
    setTimeout(function(){ playClip('win'); }, 420);
    setTimeout(toMenuMusic, 1400);
  }

  /* ==========================================================
     Number Stepping Stones
     ========================================================== */

  var stoneState = null;

  function stoneStars(levelId){
    var seen = progress['stones-' + levelId] || {};
    var n = 0;
    Object.keys(seen).forEach(function(k){ if(seen[k].right > 0) n++; });
    return n;
  }

  function openStonePicker(){

  function startStones(lv){
    var picked = shuffle(lv.puzzles.slice())
                   .slice(0, Math.min(mode.roundsPerGame, lv.puzzles.length));
    stoneState = { lv:lv, list:picked, at:0 };
    buildGems(gemRow, picked.length);
    nextCrossing();
  }

  function sizeStream(count, tileCount){
    var box = field.getBoundingClientRect();
    var w = Math.max(160, box.width), h = Math.max(160, box.height);
    var stone = Math.min((w * 0.88) / count - 8, h * 0.18, 78);
    var perRow = Math.min(tileCount, Math.max(4, Math.floor(w / 78)));
    var tile = Math.min((w * 0.9) / perRow - 10, h * 0.16, 70);
    return { stone:Math.max(28, stone), tile:Math.max(32, tile) };
  }

  function nextCrossing(){
    stopVoice();
    var st = stoneState;
    if(!st) return;

    var puzzle = st.list[st.at];
    var seq = puzzle.seq;
    st.seq = seq;
    st.placed = 0;
    st.clean = true;
    st.given = Math.min(st.lv.given, seq.length - 1);

    field.innerHTML = '';
    prompt.innerHTML = '<span>Put the stones in order</span>';

    var wrap = document.createElement('div');
    wrap.className = 'stream-wrap';

    var stream = document.createElement('div');
    stream.className = 'stream';

    var need = seq.slice(st.given);
    var span = Math.max(1, seq[1] - seq[0]);
    var extras = [];
    var guard = 0;
    while(extras.length < st.lv.decoys && guard++ < 200){
      var cand = seq[0] + Math.floor(Math.random() * (seq.length + 3)) * span
                 + (Math.random() < 0.5 ? 1 : -1);
      if(cand > 0 && seq.indexOf(cand) === -1 && extras.indexOf(cand) === -1) extras.push(cand);
    }
    var pool = shuffle(need.concat(extras));
    var sz = sizeStream(seq.length, pool.length);

    seq.forEach(function(v, i){
      var sn = document.createElement('span');
      sn.style.setProperty('--stone', sz.stone.toFixed(0) + 'px');
      if(i < st.given){ sn.className = 'stone given'; sn.textContent = v; }
      else { sn.className = 'stone gap'; }
      stream.appendChild(sn);
    });

    var walker = document.createElement('img');
    walker.className = 'walker';
    walker.src = 'ciela-idle.png';
    walker.alt = '';
    walker.style.setProperty('--walk', (sz.stone * 1.15).toFixed(0) + 'px');
    walker.addEventListener('error', function(){ walker.hidden = true; });
    stream.appendChild(walker);

    var row = document.createElement('div');
    row.className = 'tiles-row';
    pool.forEach(function(v){
      var t = document.createElement('button');
      t.className = 'ltile'; t.type = 'button';
      t.textContent = v;
      t.setAttribute('aria-label', 'stone ' + v);
      t.style.setProperty('--tile', sz.tile.toFixed(0) + 'px');
      t.addEventListener('click', function(){ placeStone(t, v, stream, row, walker); });
      row.appendChild(t);
    });

    wrap.appendChild(stream);
    wrap.appendChild(row);
    field.appendChild(wrap);

    st.stream = stream; st.row = row; st.walker = walker;
    requestAnimationFrame(function(){ moveWalker(stream, walker, st.given); });
    setTimeout(function(){ playClip('stones-go'); }, 320);
  }

  function moveWalker(stream, walker, slotIndex){
    if(!walker || walker.hidden) return;
    var stones = stream.querySelectorAll('.stone');
    var target = stones[Math.min(slotIndex, stones.length - 1)];
    if(!target) return;
    var sBox = stream.getBoundingClientRect();
    var tBox = target.getBoundingClientRect();
    walker.style.left = (tBox.left - sBox.left + tBox.width / 2) + 'px';
  }

  function placeStone(tile, value, stream, row, walker){
    var st = stoneState;
    if(!st || st.done) return;

    var slot = st.given + st.placed;
    if(value !== st.seq[slot]){
      st.clean = false;
      thud();
      tile.classList.remove('nope');
      void tile.offsetWidth;
      tile.classList.add('nope');
      react('nudge');
      return;
    }

    var sn = stream.children[slot];
    sn.className = 'stone set';
    sn.textContent = value;
    tile.classList.add('used');
    st.placed++;

    moveWalker(stream, walker, st.given + st.placed);
    if(walker && !walker.hidden){
      walker.classList.remove('hop');
      void walker.offsetWidth;
      walker.classList.add('hop');
    }

    if(st.given + st.placed < st.seq.length){
      chime();
      return;
    }

    st.done = true;
    row.classList.add('locked');
    stream.classList.add('done');
    chime();
    react('cheer');
    record('stones-' + st.lv.id, st.list[st.at].id, st.clean);
    if(st.clean) st.earned = (st.earned || []).concat(addStars(1));
    lightGems(gemRow, st.at + 1);
    prompt.innerHTML = '<span>Across!</span>';

    setTimeout(function(){
      var key = randomCheerKey();
      if(key) playClip(key);
    }, 300);

    setTimeout(function(){
      st.done = false;
      st.at++;
      if(st.at >= st.list.length) finishStones();
      else nextCrossing();
    }, 1700);
  }

  function finishStones(){
    var st = stoneState;
    winTitle.textContent = mode.done;
    buildGems(trophy, st.list.length);
    lightGems(trophy, st.list.length);
    showPrize((st.earned || []).concat(addStars(1)));
    refreshChest();
    winVeil.hidden = false;
    setTimeout(function(){ playClip('win'); }, 420);
    setTimeout(toMenuMusic, 1400);
  }

  /* ==========================================================
     Word Bridge
     ========================================================== */

  var levelVeil = document.getElementById('levelVeil');
  var levelList = document.getElementById('levelList');
  var bridgeState = null;

  function starsFor(levelId){
    var seen = progress['bridge-' + levelId] || {};
    var n = 0;
    Object.keys(seen).forEach(function(k){ if(seen[k].right > 0) n++; });
    return n;
  }

  function openLevelPicker(){
    levelList.innerHTML = '';
    document.querySelector('#levelVeil h1').textContent = 'Build the Word Bridge';
    document.querySelector('#levelVeil p').textContent = 'Pick how tricky it should be.';
    BRIDGE_LEVELS.forEach(function(lv){

  function startBridge(lv){
    var picked = shuffle(lv.words.slice()).slice(0, Math.min(mode.wordsPerGame, lv.words.length));
    bridgeState = { lv:lv, words:picked, at:0, clean:true };
    buildGems(gemRow, picked.length);
    nextWord();
  }

  function sizeBridge(word, tileCount){
    /* keep planks and tiles inside the field on any screen */
    var box = field.getBoundingClientRect();
    var w = Math.max(160, box.width), h = Math.max(160, box.height);
    var plank = Math.min((w * 0.92) / word.length - 8, h * 0.20, 82);
    var perRow = Math.min(tileCount, Math.max(4, Math.floor(w / 74)));
    var tile = Math.min((w * 0.92) / perRow - 10, h * 0.17, 70);
    return { plank:Math.max(26, plank), tile:Math.max(30, tile) };
  }

  function nextWord(){
    stopVoice();
    var st = bridgeState;
    if(!st) return;
    var word = st.words[st.at];
    var prop = propForWord(word);
    var letters = word.toUpperCase().split('');

    st.word = word;
    st.letters = letters;
    st.filled = 0;
    st.clean = true;

    /* Cloud Beginner leaves most planks already in place */
    var given = st.lv.blanks ? Math.max(0, letters.length - st.lv.blanks) : 0;
    st.given = given;

    field.innerHTML = '';
    prompt.innerHTML = '<span>Build the bridge</span>';

    var wrap = document.createElement('div');
    wrap.className = 'bridge-wrap';

    var clue = document.createElement('div');
    clue.className = 'bridge-clue';
    if(prop){
      var img = document.createElement('img');
      img.src = prop.file; img.alt = '';
      img.addEventListener('error', function(){ img.remove(); });
      clue.appendChild(img);
    }

    var bridge = document.createElement('div');
    bridge.className = 'bridge';

    var need = letters.slice(given);            /* letters still to place */
    var pool = need.slice();
    var extras = shuffle(ALPHABET.filter(function(L){
      return letters.indexOf(L) === -1;
    })).slice(0, st.lv.decoys);
    pool = shuffle(pool.concat(extras));

    var sz = sizeBridge(word, pool.length);

    letters.forEach(function(L, i){
      var pl = document.createElement('span');
      pl.style.setProperty('--plank', sz.plank.toFixed(0) + 'px');
      if(i < given){
        pl.className = 'plank given';
        pl.textContent = L;
      }else{
        pl.className = 'plank gap';
      }
      bridge.appendChild(pl);
    });

    var row = document.createElement('div');
    row.className = 'tiles-row';
    pool.forEach(function(L){
      var t = document.createElement('button');
      t.className = 'ltile';
      t.type = 'button';
      t.textContent = L;
      t.setAttribute('aria-label', 'letter ' + L);
      t.style.setProperty('--tile', sz.tile.toFixed(0) + 'px');
      t.addEventListener('click', function(){ placeLetter(t, L, bridge, row); });
      row.appendChild(t);
    });

    wrap.appendChild(clue);
    wrap.appendChild(bridge);
    wrap.appendChild(row);
    field.appendChild(wrap);

    st.bridge = bridge; st.row = row;
    setTimeout(function(){ playClip('word-' + word); }, 320);
  }

  function placeLetter(tile, L, bridge, row){
    var st = bridgeState;
    if(!st || st.done) return;

    var slot = st.given + st.filled;
    if(L !== st.letters[slot]){
      st.clean = false;
      thud();
      tile.classList.remove('nope');
      void tile.offsetWidth;
      tile.classList.add('nope');
      react('nudge');
      return;
    }

    var pl = bridge.children[slot];
    pl.className = 'plank built';
    pl.textContent = L;
    pl.style.setProperty('--plank', tile.style.getPropertyValue('--tile') || '58px');
    pl.style.removeProperty('--plank');
    tile.classList.add('used');
    st.filled++;

    if(st.given + st.filled < st.letters.length){
      chime();
      return;
    }

    /* word complete */
    st.done = true;
    row.classList.add('locked');
    bridge.classList.add('done');
    chime();
    react('cheer');
    record('bridge-' + st.lv.id, st.word, st.clean);
    if(st.clean) st.earned = (st.earned || []).concat(addStars(1));
    lightGems(gemRow, st.at + 1);
    prompt.innerHTML = '<span>' + st.word.toUpperCase() + '!</span>';

    setTimeout(function(){
      var key = randomCheerKey();
      if(key) playClip(key);
    }, 300);

    setTimeout(function(){
      st.done = false;
      st.at++;
      if(st.at >= st.words.length) finishBridge();
      else nextWord();
    }, 1800);
  }

  function finishBridge(){
    var st = bridgeState;
    winTitle.textContent = mode.done;
    buildGems(trophy, st.words.length);
    lightGems(trophy, st.words.length);
    showPrize((st.earned || []).concat(addStars(1)));
    refreshChest();
    winVeil.hidden = false;
    setTimeout(function(){ playClip('win'); }, 420);
    setTimeout(toMenuMusic, 1400);
  }

  function speakPrompt(){
    if(!mode || !rounds.length) return;
    var pair = mode.speak.call(mode, currentTarget());
    if(pair[0]) playClip(pair[0]);
  }

  /* Chispa's face changes with what just happened, then drifts back
     to his resting expression. */
  var CHISPA_FACE = {
    rest:    'chispa-content.png',
    cheer:   ['chispa-giggle.png','chispa-excited.png','chispa-wink.png'],
    nudge:   'chispa-curious.png'
  };
  var chispaTimer = null;

  function chispaFace(mood){
    if(!chispa || chispa.hidden) return;
    if(calmLook){
      /* he stays settled through the calm routine */
      chispa.src = CALM_LOOK.chispa;
      return;
    }
    var src;
    if(mood === 'cheer'){
      var pool = CHISPA_FACE.cheer;
      src = pool[Math.floor(Math.random() * pool.length)];
    }else if(mood === 'nudge'){
      src = CHISPA_FACE.nudge;
    }else{
      src = CHISPA_FACE.rest;
    }
    chispa.src = src;
    clearTimeout(chispaTimer);
    if(mood !== 'rest'){
      chispaTimer = setTimeout(function(){
        chispa.src = CHISPA_FACE.rest;
      }, mood === 'cheer' ? 2400 : 1600);
    }
  }

  function react(mood){
    chispaFace(mood);
    [teacher, chispa].forEach(function(node, i){
      if(!node || node.hidden) return;
      node.classList.remove('cheer','nudge');
      void node.offsetWidth;
      setTimeout(function(){ node.classList.add(mood); }, i * 110);
    });
  }

  function sparkle(el){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var box = el.getBoundingClientRect(), host = field.getBoundingClientRect();
    var cx = box.left - host.left + box.width / 2;
    var cy = box.top - host.top + box.height / 2;
    for(var i = 0; i < 16; i++){
      var s = document.createElement('span');
      var ang = (Math.PI * 2 / 16) * i + Math.random() * 0.4;
      var dist = 70 + Math.random() * 90;
      s.className = 'spark';
      s.style.left = cx + 'px';
      s.style.top = cy + 'px';
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      field.appendChild(s);
      (function(node){ setTimeout(function(){ node.remove(); }, 800); })(s);
    }
  }

  function currentItemKey(){
    var t = currentTarget();
    if(t === undefined || t === null) return null;
    if(mode.itemKey) return mode.itemKey.call(mode, t);
    if(typeof t === 'object') return t.key || t.letter || null;
    return String(t);
  }

  function judge(value, el){
    if(busy) return;

    if(!matches(value, answerValue())){
      record(modeKey, currentItemKey(), false);
      thud();
      el.classList.add('wrong','faded');
      react('nudge');
      setTimeout(function(){ el.classList.remove('wrong'); }, 520);
      setTimeout(speakPrompt, 950);
      return;
    }

    record(modeKey, currentItemKey(), true);
    busy = true;
    field.classList.add('locked');
    chime();
    sparkle(el);
    el.classList.add('correct');
    lightGems(gemRow, index + 1);
    react('cheer');

    var cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    prompt.innerHTML = cheer;

    setTimeout(function(){
      var key = randomCheerKey();
      if(key) playClip(key);
    }, 280);

    setTimeout(function(){
      index++;
      if(index >= rounds.length) finish();
      else newRound();
    }, 1750);
  }

  function showPrize(list){
    var box = document.getElementById('prize');
    if(!list || !list.length){ box.hidden = true; return; }
    var t = list[list.length - 1];
    document.getElementById('prizeImg').src = t.file;
    document.getElementById('prizeName').textContent =
      t.name + (list.length > 1 ? ' and ' + (list.length - 1) + ' more' : '');
    box.hidden = false;
  }

  function finish(){
    var total = mode.custom ? mode.pairs : rounds.length;
    winTitle.textContent = mode.done;
    buildGems(trophy, total);
    lightGems(trophy, total);
    showPrize(addStars(1));
    refreshChest();
    winVeil.hidden = false;
    setTimeout(function(){ playClip('win'); }, 450);
    setTimeout(toMenuMusic, 1400);
  }

  function startMode(key){
    stopEverything();
    modeKey = key;
    mode = MODES[key];
    levelVeil.hidden = true;
    homeVeil.hidden = true;
    winVeil.hidden = true;
    /* the sung theme belongs to the menus; every game, including the calm
       routine, plays the instrumental underneath */
    toGameMusic();

    if(mode.custom){
      rounds = [];
      index = 0;
      buildGems(gemRow, mode.pairs);
      mode.start.call(mode);
      return;
    }

    rounds = mode.plan.call(mode);
    index = 0;
    buildGems(gemRow, rounds.length);
    newRound();
  }

  /* Every activity that schedules its own timers has to be shut down
     explicitly, or it keeps talking over whatever screen comes next. */
  function stopEverything(){
    if(calmState){
      calmState.stopped = true;
      if(calmState.stopGlitter) calmState.stopGlitter();
    }
    calmState = null;
    deckState = null;
    bridgeState = null;
    stoneState = null;
    crystalState = null;
    stopCalmNoise();
    stopVoice();
    setCrewLook(false);

    prompt.innerHTML = '';

  /* ==========================================================
     Grown-ups: gate + progress report
     ========================================================== */

  var gateVeil    = document.getElementById('gateVeil');
  var gateQuestion= document.getElementById('gateQuestion');
  var gateOptions = document.getElementById('gateOptions');
  var reportVeil  = document.getElementById('reportVeil');
  var reportBody  = document.getElementById('reportBody');

  function openGate(){
    var a = 3 + Math.floor(Math.random() * 7);   /* 3-9  */
    var b = 4 + Math.floor(Math.random() * 6);   /* 4-9  */
    var answer = a * b;
    gateQuestion.textContent = 'What is ' + a + ' \u00d7 ' + b + '?';

    var choices = [answer];
    while(choices.length < 3){
      var off = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 9));
      var wrong = answer + off;
      if(wrong > 0 && choices.indexOf(wrong) === -1) choices.push(wrong);
    }
    shuffle(choices);

    gateOptions.innerHTML = '';
    choices.forEach(function(n){
      var b2 = document.createElement('button');
      b2.className = 'go ghost';
      b2.type = 'button';
      b2.textContent = n;
      b2.addEventListener('click', function(){
        if(n === answer){ gateVeil.hidden = true; openReport(); }
        else openGate();
      });
      gateOptions.appendChild(b2);
    });

    homeVeil.hidden = true;
    gateVeil.hidden = false;
  }

  function bandFor(slot){
    if(!slot || (slot.right + slot.wrong) === 0) return '';
    if(slot.wrong === 0) return 'solid';
    if(slot.right > slot.wrong) return 'shaky';
    return 'hard';
  }

  function openReport(){
    reportBody.innerHTML = '';
    var anyData = false;

    var sections = Object.keys(MODES);
    BRIDGE_LEVELS.forEach(function(lv){ sections.push('bridge-' + lv.id); });
    STONE_LEVELS.forEach(function(lv){ sections.push('stones-' + lv.id); });

    sections.forEach(function(key){
      if(!itemsFor(key).length) return;   /* nothing trackable, e.g. the card game */
      var section = document.createElement('div');
      section.className = 'report-mode';

      var h = document.createElement('h2');
      var met = metCount(key), total = itemsFor(key).length;
      var title = MODES[key] ? MODES[key].label
                : key.indexOf('stones-') === 0
                  ? 'Stepping Stones \u2014 ' + stoneLevelById(key.slice(7)).name
                  : 'Word Bridge \u2014 ' + levelById(key.slice(7)).name;
      h.textContent = title + ' \u2014 ' + met + ' of ' + total;
      section.appendChild(h);

      var seen = progress[key] || {};
      var touched = itemsFor(key).filter(function(id){ return seen[id]; });

      if(!touched.length){
        var none = document.createElement('p');
        none.className = 'none';
        none.textContent = 'Not played yet.';
        section.appendChild(none);
      }else{
        anyData = true;
        var wrap = document.createElement('div');
        wrap.className = 'chips';
        itemsFor(key).forEach(function(id){
          var slot = seen[id];
          var chip = document.createElement('span');
          chip.className = 'chipitem ' + bandFor(slot);
          chip.appendChild(document.createTextNode(itemLabel(key, id)));
          if(slot){
            var n = document.createElement('span');
            n.className = 'n';
            n.textContent = slot.right + '\u2713 ' + slot.wrong + '\u2717';
            chip.appendChild(n);
          }
          wrap.appendChild(chip);
        });
        section.appendChild(wrap);
      }
      reportBody.appendChild(section);
    });

    var legend = document.createElement('div');
    legend.className = 'legend';
    legend.innerHTML =
      '<span><i style="background:#D6F2E2;box-shadow:inset 0 0 0 1.5px #7fd1a6"></i>always right</span>' +
      '<span><i style="background:#FBE6C8;box-shadow:inset 0 0 0 1.5px #e8b75a"></i>mostly right</span>' +
      '<span><i style="background:#F9D9D4;box-shadow:inset 0 0 0 1.5px #e8705a"></i>needs practice</span>' +
      '<span><i style="background:#E7EDF0"></i>not seen yet</span>';
    reportBody.appendChild(legend);

    if(!anyData){
      var note = document.createElement('p');
      note.className = 'none';
      note.textContent = 'Play a game and results will show up here.';
      reportBody.appendChild(note);
    }

    reportVeil.hidden = false;
  }

  /* ---------- treasure vault ---------- */

  var vaultVeil = document.getElementById('vaultVeil');
  var vaultGrid = document.getElementById('vaultGrid');

  function refreshChest(){
    var el = document.getElementById('chestCount');
    if(el) el.textContent = unlockedCount() + ' / ' + TREASURES.length;
  }

  function openVault(fresh){
    var stars = totalStars();
    vaultGrid.innerHTML = '';
    TREASURES.forEach(function(t, i){
      var cost = treasureCost(i);
      var slot = document.createElement('div');
      slot.className = 'slot' + (stars >= cost ? '' : ' locked');
      if(stars < cost) slot.setAttribute('data-cost', cost);
      if(fresh && fresh.indexOf(t) > -1) slot.classList.add('fresh');
      var img = document.createElement('img');
      img.src = t.file;
      img.alt = stars >= cost ? t.name : '';
      img.addEventListener('error', function(){ img.remove(); });
      slot.appendChild(img);
      slot.title = stars >= cost ? t.name : ('Needs ' + cost + ' stars');
      vaultGrid.appendChild(slot);
    });
    var line = document.getElementById('vaultLine');
    var left = TREASURES.length - unlockedCount();
    line.textContent = left
      ? 'You have ' + stars + ' star' + (stars === 1 ? '' : 's') + '. ' + left + ' still hidden.'
      : 'You found every treasure!';
    homeVeil.hidden = true;
    vaultVeil.hidden = false;
  }

  document.getElementById('gateCancel').addEventListener('click', function(){
    gateVeil.hidden = true;
    homeVeil.hidden = false;
  });

  document.getElementById('reportClose').addEventListener('click', function(){
    reportVeil.hidden = true;
    homeVeil.hidden = false;
    buildTiles();
  });

  var resetArmed = false;
  document.getElementById('reportReset').addEventListener('click', function(){
    var btn = this;
    if(!resetArmed){
      resetArmed = true;
      btn.textContent = 'Tap again to erase';
      setTimeout(function(){
        resetArmed = false;
        btn.textContent = 'Start over';
      }, 4000);
      return;
    }
    clearProgress();
    resetArmed = false;
    btn.textContent = 'Start over';
    openReport();
    buildTiles();
  });

  function buildTiles(){
    tiles.innerHTML = '';
    Object.keys(MODES).forEach(function(key){
      var m = MODES[key];
      var b = document.createElement('button');
      b.className = 'tile';
      b.type = 'button';

      if(m.icon.indexOf('text:') === 0){
        var glyph = document.createElement('span');
        glyph.className = 'glyphicon';
        glyph.textContent = m.icon.slice(5);
        b.appendChild(glyph);
      }else{
        var img = document.createElement('img');
        img.src = m.icon;
        img.alt = '';
        img.addEventListener('error', function(){
          var span = document.createElement('span');
          span.className = 'glyphicon';
          span.textContent = m.label.charAt(0);
          img.replaceWith(span);
        });
        b.appendChild(img);
      }

      var label = document.createElement('span');
      label.textContent = m.label;
      b.appendChild(label);

      var total = itemsFor(key).length;
      var met = metCount(key);
      if(key === 'bridge'){
        total = 0; met = 0;
        BRIDGE_LEVELS.forEach(function(lv){
          total += lv.words.length;
          met += starsFor(lv.id);
        });
      }
      if(key === 'stones'){
        total = 0; met = 0;
        STONE_LEVELS.forEach(function(lv){
          total += lv.puzzles.length;
          met += stoneStars(lv.id);
        });
      }
      if(met > 0){
        var tally = document.createElement('span');
        tally.className = 'tally';
        tally.textContent = met + ' of ' + total;
        b.appendChild(tally);
      }

      b.addEventListener('click', function(){ startMode(key); });
      tiles.appendChild(b);
    });
  }

  /* ==========================================================
     Wiring
     ========================================================== */

  wakeVeil.addEventListener('click', function(){
    wakeVeil.hidden = true;
    homeVeil.hidden = false;
    if(!muted && titleOk){
      titleMusic.volume = menuVolume();
      titleMusic.play().catch(function(){});
    }
  });

  document.getElementById('home').addEventListener('click', goHome);

  document.getElementById('mute').addEventListener('click', function(){
    setMuted(!muted);
  });

  teacher.addEventListener('click', function(){
    if(!busy) speakPrompt();
  });

  document.getElementById('againBtn').addEventListener('click', function(){
    if(modeKey) startMode(modeKey);
  });

  document.getElementById('levelBack').addEventListener('click', function(){
    levelVeil.hidden = true;
    goHome();
  });

  document.getElementById('backBtn').addEventListener('click', goHome);

  buildTiles();
  buildGems(gemRow, 0);
  refreshChest();

  /* ?debug on the URL lists which audio files were found */
  if(location.search.indexOf('debug') > -1){
    setTimeout(function(){
      var box = document.createElement('pre');
      box.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99;max-height:45vh;overflow:auto;margin:0;padding:8px;font:11px monospace;background:rgba(0,0,0,.85);color:#8f8;white-space:pre-wrap';
      box.textContent = audioReport.sort().join('\n');
      document.body.appendChild(box);
    }, 4000);
  }
})();
</script>
</body>
</html>
