<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ciela's World of Learning — Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#8FD8EA;
  --horizon:#F7E3B6;
  --teal:#0E7C86;
  --teal-deep:#0A5A62;
  --gold:#E8B75A;
  --gold-light:#FBE39B;
  --navy:#153349;
  --mint:#4FC58C;
  --coral:#E8705A;
  --field-inset:14%;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{height:100%;overflow:hidden}

body{
  font-family:'Nunito',system-ui,sans-serif;
  background:linear-gradient(180deg,var(--sky) 0%,#BFE7E4 45%,var(--horizon) 100%);
  color:var(--navy);
  user-select:none;
  -webkit-user-select:none;
}

/* ---------- stage ---------- */

.stage{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.stage::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:url('backgroundPlate.png');
  background-size:cover;
  background-position:center;
  opacity:0;
  transition:opacity .6s ease;
  z-index:0;
}

.stage.has-bg::before{opacity:1}

/* ---------- header ---------- */

.bar{
  position:relative;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:max(10px,env(safe-area-inset-top)) 16px 6px;
}

.mark{height:clamp(30px,7vw,52px);width:auto;filter:drop-shadow(0 2px 6px rgba(10,60,70,.35))}
.mark[hidden]{display:none}

.bar-right{display:flex;align-items:center;gap:10px;max-width:62%}

.gems{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

.mute{
  flex:0 0 auto;
  width:clamp(34px,8vw,46px);
  height:clamp(34px,8vw,46px);
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.8);
  box-shadow:0 3px 10px rgba(12,70,80,.28),inset 0 0 0 2px var(--gold);
  font-size:clamp(15px,3.8vw,21px);
  line-height:1;
  cursor:pointer;
  transition:transform .18s ease,opacity .18s ease;
}
.mute:hover,.mute:focus-visible{transform:scale(1.08)}
.mute:focus-visible{outline:3px solid #fff;outline-offset:3px}
.mute[aria-pressed="true"]{opacity:.55}

.gem{
  width:clamp(13px,3.2vw,20px);
  height:clamp(13px,3.2vw,20px);
  border-radius:3px;
  background:rgba(255,255,255,.28);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);
  transform:rotate(45deg);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .35s ease;
}

.gem.won{
  background:linear-gradient(140deg,var(--gold-light),var(--gold));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85),0 0 12px rgba(232,183,90,.75);
  transform:rotate(45deg) scale(1.12);
}

/* ---------- prompt ---------- */

.prompt{
  position:relative;
  z-index:3;
  align-self:center;
  margin-top:2px;
  padding:9px 26px;
  border-radius:999px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(6px);
  box-shadow:0 4px 18px rgba(12,70,80,.22),inset 0 0 0 2px rgba(232,183,90,.55);
  font-family:'Baloo 2',cursive;
  font-weight:700;
  font-size:clamp(17px,4.6vw,30px);
  line-height:1.15;
  letter-spacing:.01em;
  white-space:nowrap;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}

.prompt em{font-style:normal;color:var(--teal);font-weight:800}
.prompt.pulse{transform:scale(1.07)}

/* ---------- play field ---------- */

.field{
  position:relative;
  z-index:2;
  flex:1;
  min-height:0;
}

.num{
  position:absolute;
  transform:translate(-50%,-50%);
  font-family:'Baloo 2',cursive;
  font-weight:800;
  font-size:var(--size);
  line-height:.86;
  cursor:pointer;
  border:0;
  background:none;
  padding:8px 14px;
  color:transparent;
  background-image:linear-gradient(165deg,#FFFFFF 0%,#BFF0F4 26%,var(--teal) 62%,var(--teal-deep) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-stroke:clamp(2px,.7vw,4px) var(--gold);
  paint-order:stroke fill;
  filter:drop-shadow(0 6px 10px rgba(9,60,70,.4));
  animation:drift var(--dur) ease-in-out var(--delay) infinite alternate;
  touch-action:manipulation;
  transition:opacity .25s ease;
}

.num:focus-visible{
  outline:4px solid #fff;
  outline-offset:6px;
  border-radius:18px;
}

@keyframes drift{
  from{transform:translate(-50%,-50%) translateY(-9px) rotate(var(--tilt))}
  to  {transform:translate(-50%,-50%) translateY(11px) rotate(calc(var(--tilt) * -1))}
}

.num.correct{animation:pop .55s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(1)}
  45%{transform:translate(-50%,-50%) scale(1.38) rotate(4deg)}
  100%{transform:translate(-50%,-50%) scale(0) rotate(-10deg);opacity:0}
}

.num.wrong{animation:wobble .5s ease}
@keyframes wobble{
  0%,100%{transform:translate(-50%,-50%) rotate(0)}
  20%{transform:translate(-50%,-50%) rotate(-9deg)}
  45%{transform:translate(-50%,-50%) rotate(8deg)}
  70%{transform:translate(-50%,-50%) rotate(-5deg)}
}

.num.faded{opacity:.42}
.field.locked .num{pointer-events:none}

/* ---------- sparkles ---------- */

.spark{
  position:absolute;
  width:12px;height:12px;
  margin:-6px 0 0 -6px;
  border-radius:2px;
  background:linear-gradient(140deg,#fff,var(--gold));
  transform:rotate(45deg);
  pointer-events:none;
  animation:fly .75s ease-out forwards;
}

@keyframes fly{
  0%{opacity:1;transform:rotate(45deg) translate(0,0) scale(1)}
  100%{opacity:0;transform:rotate(220deg) translate(var(--dx),var(--dy)) scale(.2)}
}

/* ---------- Ciela + Chispa ---------- */

.crew{
  position:relative;
  z-index:3;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:0 12px max(8px,env(safe-area-inset-bottom));
  pointer-events:none;
}

/* Ciela — main character, teacher, tap her to hear the number again */
.teacher{
  pointer-events:auto;
  position:relative;
  border:0;
  background:none;
  padding:0;
  cursor:pointer;
  line-height:0;
  transform-origin:bottom center;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.teacher:hover,.teacher:focus-visible{transform:scale(1.04)}
.teacher:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:22px}

.ciela{
  height:clamp(104px,28vh,250px);
  width:auto;
  filter:drop-shadow(0 8px 14px rgba(9,60,70,.35));
  display:block;
}
.ciela[hidden]{display:none}

.speaker{
  position:absolute;
  top:2px;
  right:-6px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:clamp(30px,7.5vw,44px);
  height:clamp(30px,7.5vw,44px);
  border-radius:50%;
  background:rgba(255,255,255,.9);
  box-shadow:0 3px 10px rgba(12,70,80,.3),inset 0 0 0 2.5px var(--gold);
  font-size:clamp(14px,3.6vw,21px);
  line-height:1;
}

/* Chispa — the dog, cheers along */
.pup{
  height:clamp(58px,15vh,124px);
  width:auto;
  filter:drop-shadow(0 6px 12px rgba(9,60,70,.32));
  transform-origin:bottom center;
}
.pup[hidden]{display:none}

.teacher.cheer,.pup.cheer{animation:hop .65s cubic-bezier(.34,1.56,.64,1) 2}
.teacher.nudge,.pup.nudge{animation:sway .5s ease}

@keyframes hop{
  0%,100%{transform:translateY(0) rotate(0)}
  40%{transform:translateY(-16px) rotate(-4deg)}
  70%{transform:translateY(-4px) rotate(3deg)}
}
@keyframes sway{
  0%,100%{transform:rotate(0)}
  35%{transform:rotate(-5deg)}
  70%{transform:rotate(4deg)}
}

/* ---------- overlays ---------- */

.veil{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(16px,4vh,30px);
  padding:24px;
  text-align:center;
  background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.5),rgba(14,124,134,.72));
  backdrop-filter:blur(3px);
  transition:opacity .45s ease,visibility .45s;
}
.veil[hidden]{opacity:0;visibility:hidden;display:flex;pointer-events:none}

.veil-mark{width:min(74vw,420px);height:auto;filter:drop-shadow(0 6px 18px rgba(8,50,60,.45))}
.veil-mark[hidden]{display:none}

.veil h1{
  font-family:'Baloo 2',cursive;
  font-weight:800;
  font-size:clamp(30px,9vw,58px);
  color:#fff;
  text-shadow:0 3px 0 var(--teal-deep),0 8px 22px rgba(8,50,60,.5);
  line-height:1.05;
}

.veil p{
  font-size:clamp(15px,4.2vw,21px);
  font-weight:700;
  color:#fff;
  text-shadow:0 2px 8px rgba(8,50,60,.6);
  max-width:22ch;
}

.go{
  font-family:'Baloo 2',cursive;
  font-weight:800;
  font-size:clamp(21px,5.6vw,32px);
  color:var(--navy);
  background:linear-gradient(165deg,var(--gold-light),var(--gold));
  border:0;
  border-radius:999px;
  padding:clamp(13px,3vh,20px) clamp(34px,9vw,62px);
  cursor:pointer;
  box-shadow:0 6px 0 #B98A32,0 12px 26px rgba(8,50,60,.4);
  transition:transform .16s ease,box-shadow .16s ease;
}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 #B98A32,0 5px 14px rgba(8,50,60,.4)}
.go:focus-visible{outline:4px solid #fff;outline-offset:4px}

.trophy{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:320px}
.trophy .gem{width:26px;height:26px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .num{animation:none}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <header class="bar">
    <img class="mark" id="mark" src="cielaWorldLogo.png" alt="Ciela's World of Learning">
    <div class="bar-right">
      <div class="gems" id="gems" aria-label="Gems collected"></div>
      <button class="mute" id="mute" aria-label="Turn sound off" aria-pressed="false">🔊</button>
    </div>
  </header>

  <p class="prompt" id="prompt">Find the <em>1</em></p>

  <div class="field" id="field" role="group" aria-label="Floating numbers"></div>

  <div class="crew">
    <button class="teacher" id="again" aria-label="Ask Ciela to say the number again">
      <img class="ciela" id="ciela" src="cielaBust.png" alt="Ciela">
      <span class="speaker" aria-hidden="true">🔊</span>
    </button>
    <img class="pup" id="chispa" src="Chispa-head-icon-250.png" alt="">
  </div>
</div>

<div class="veil" id="titleVeil">
  <img class="veil-mark" id="titleMark" src="cielaWorldLogo.png" alt="Ciela's World of Learning">
  <p>Listen for the number, then tap it in the sky.</p>
  <button class="go" id="startBtn">Start playing</button>
</div>

<div class="veil" id="winVeil" hidden>
  <h1>You found all ten!</h1>
  <div class="trophy" id="trophy"></div>
  <button class="go" id="againBtn">Play again</button>
</div>

<script>
(function(){
  'use strict';

  var WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
  var CHEERS = ['Great job!','You got it!','Nice tapping!','Well done!','That is the one!'];
  var TOTAL = 10;

  var field   = document.getElementById('field');
  var prompt  = document.getElementById('prompt');
  var gemRow  = document.getElementById('gems');
  var trophy  = document.getElementById('trophy');
  var ciela   = document.getElementById('ciela');
  var stage   = document.getElementById('stage');
  var titleVeil = document.getElementById('titleVeil');
  var winVeil = document.getElementById('winVeil');

  var level = 1;
  var target = 1;
  var busy = false;
  var audioCtx = null;

  /* ----- art that may be missing degrades quietly ----- */

  function hideIfBroken(el){
    if(!el) return;
    el.addEventListener('error',function(){ el.hidden = true; });
    if(el.complete && el.naturalWidth === 0) el.hidden = true;
  }
  ['mark','ciela','titleMark','chispa'].forEach(function(id){ hideIfBroken(document.getElementById(id)); });

  var chispa = document.getElementById('chispa');
  var teacher = document.getElementById('again');

  /* if Ciela's art is missing the speaker badge still needs to be tappable */
  ciela.addEventListener('error', function(){
    teacher.querySelector('.speaker').style.cssText = 'position:static;width:clamp(52px,13vw,80px);height:clamp(52px,13vw,80px);font-size:clamp(24px,6vw,36px)';
  });

  var bgProbe = new Image();
  bgProbe.onload = function(){ stage.classList.add('has-bg'); };
  bgProbe.src = 'backgroundPlate.png';

  /* ----- sound ----- */

  var muted = false;

  function tone(freqs, type, gainPeak){
    if(muted) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      freqs.forEach(function(f,i){
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = audioCtx.currentTime + i * 0.09;
        osc.type = type;
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(gainPeak, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.34);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.36);
      });
    }catch(e){}
  }

  function chime(){
    if(clips['correct']) playClip('correct', null);
    else tone([523.25, 659.25, 783.99, 1046.5], 'triangle', 0.16);
  }

  function thud(){
    if(clips['wrong']) playClip('wrong', null);
    else tone([196, 174.6], 'sine', 0.11);
  }

  /* Voice clips: audio/find-1.mp3 ... find-10.mp3, audio/cheer-1.mp3 ...
     Anything missing quietly falls back to the browser's speech voice. */

  var clips = {};
  var audioReport = [];

  /* Filenames in the repo don't all follow one convention, so each clip
     tries a list of spellings. We probe with a HEAD request rather than
     waiting on media events, because phone browsers often refuse to
     preload audio and those events then never fire. */
  function candidates(stem){
    return [
      stem + '.mp3',
      'audio' + stem + '.mp3',
      'audio/' + stem + '.mp3',
      stem + '.mp3.mp3',
      'audio' + stem + '.mp3.mp3',
      'audio/' + stem + '.mp3.mp3'
    ];
  }

  function findFile(stem, done){
    var names = candidates(stem);
    var i = 0;
    (function next(){
      if(i >= names.length){ audioReport.push(stem + ': not found'); done(null); return; }
      var url = names[i];
      fetch(url, { method:'HEAD', cache:'no-store' })
        .then(function(r){
          if(r.ok){ audioReport.push(stem + ' -> ' + url); done(url); }
          else { i++; next(); }
        })
        .catch(function(){ i++; next(); });
    })();
  }

  function loadClip(key, stem){
    findFile(stem, function(url){
      if(!url) return;
      var a = new Audio(url);
      a.preload = 'auto';
      clips[key] = a;
    });
  }

  for(var n = 1; n <= TOTAL; n++) loadClip('find-' + n, 'find-' + n);
  for(var c = 1; c <= 6; c++) loadClip('cheer-' + c, 'cheer-' + c);
  loadClip('win', 'win');
  loadClip('correct', 'correct');
  loadClip('wrong', 'wrong');

  var music = new Audio();      /* instrumental loop, under gameplay */
  var musicOk = false;
  music.loop = true;
  music.preload = 'auto';
  music.volume = 0.32;
  findFile('theme', function(url){
    if(!url) return;
    music.src = url;
    musicOk = true;
  });

  var titleMusic = new Audio();  /* sung version, title + win screens */
  var titleOk = false;
  titleMusic.loop = true;
  titleMusic.preload = 'auto';
  titleMusic.volume = 0.5;
  findFile('title-theme', function(url){
    if(!url) return;
    titleMusic.src = url;
    titleOk = true;
    if(!muted && !titleVeil.hidden) titleMusic.play().catch(function(){});
  });

  /* ?debug on the URL prints which files were found */
  if(location.search.indexOf('debug') > -1){
    setTimeout(function(){
      var box = document.createElement('pre');
      box.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99;max-height:45vh;overflow:auto;margin:0;padding:8px;font:11px monospace;background:rgba(0,0,0,.85);color:#8f8;white-space:pre-wrap';
      box.textContent = audioReport.sort().join('\n');
      document.body.appendChild(box);
    }, 3000);
  }

  /* Mobile browsers block audio until the first tap, so if autoplay was
     refused, start the sung theme on the first touch anywhere. */
  function nudgeTitleMusic(){
    if(muted || !titleOk || titleVeil.hidden) return;
    if(titleMusic.paused) titleMusic.play().catch(function(){});
  }
  document.addEventListener('pointerdown', nudgeTitleMusic, { once:true });

  function fade(el, to, ms, thenStop){
    var from = el.volume;
    var steps = Math.max(1, Math.round(ms / 40));
    var i = 0;
    var timer = setInterval(function(){
      i++;
      var v = from + (to - from) * (i / steps);
      el.volume = Math.min(1, Math.max(0, v));
      if(i >= steps){
        clearInterval(timer);
        if(thenStop){ el.pause(); el.currentTime = 0; }
      }
    }, 40);
  }

  function toGameMusic(){
    if(muted) return;
    if(titleOk && !titleMusic.paused) fade(titleMusic, 0, 700, true);
    if(musicOk){
      music.volume = 0;
      music.play().catch(function(){});
      fade(music, 0.32, 900, false);
    }
  }

  function toTitleMusic(){
    if(muted) return;
    if(musicOk && !music.paused) fade(music, 0, 600, true);
    if(titleOk){
      titleMusic.volume = 0;
      titleMusic.play().catch(function(){});
      fade(titleMusic, 0.5, 800, false);
    }
  }

  function duck(on){
    if(!musicOk) return;
    music.volume = on ? 0.11 : 0.32;
  }

  function playClip(key, fallbackText){
    if(muted) return;
    var a = clips[key];
    if(a){
      try{
        a.currentTime = 0;
        duck(true);
        a.onended = function(){ duck(false); };
        var p = a.play();
        if(p && p.catch) p.catch(function(){ say(fallbackText); });
        return;
      }catch(e){}
    }
    say(fallbackText);
  }

  function say(text){
    if(muted || !text) return;
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85;
      u.pitch = 1.25;
      u.onstart = function(){ duck(true); };
      u.onend = function(){ duck(false); };
      var voices = window.speechSynthesis.getVoices();
      var pick = voices.filter(function(v){ return /^en/i.test(v.lang); });
      var warm = pick.filter(function(v){ return /female|samantha|zira|karen|moira|tessa|aria/i.test(v.name); });
      if(warm.length) u.voice = warm[0];
      else if(pick.length) u.voice = pick[0];
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function randomCheerKey(){
    var found = [];
    for(var i = 1; i <= 6; i++) if(clips['cheer-' + i]) found.push('cheer-' + i);
    return found.length ? found[Math.floor(Math.random() * found.length)] : null;
  }

  function setMuted(state){
    muted = state;
    var btn = document.getElementById('mute');
    btn.textContent = muted ? '🔇' : '🔊';
    btn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    btn.setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
    if(muted){
      try{ music.pause(); titleMusic.pause(); window.speechSynthesis.cancel(); }catch(e){}
      Object.keys(clips).forEach(function(k){ try{ clips[k].pause(); }catch(e){} });
    }else{
      var onTitle = !titleVeil.hidden || !winVeil.hidden;
      if(onTitle && titleOk){ titleMusic.volume = 0.5; titleMusic.play().catch(function(){}); }
      else if(musicOk){ music.volume = 0.32; music.play().catch(function(){}); }
    }
  }

  if('speechSynthesis' in window) window.speechSynthesis.getVoices();

  /* ----- gems ----- */

  function buildGems(container){
    container.innerHTML = '';
    for(var i = 0; i < TOTAL; i++){
      var g = document.createElement('span');
      g.className = 'gem';
      container.appendChild(g);
    }
  }

  function lightGems(container, count){
    var all = container.children;
    for(var i = 0; i < all.length; i++){
      all[i].classList.toggle('won', i < count);
    }
  }

  /* ----- round building ----- */

  function choiceCount(lv){
    if(lv <= 3) return 2;
    if(lv <= 6) return 3;
    return 4;
  }

  function slotsFor(n){
    if(n === 2) return [30, 70];
    if(n === 3) return [22, 50, 78];
    return [17, 39, 61, 83];
  }

  function shuffle(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function pickDecoys(answer, howMany){
    var pool = [];
    for(var n = 1; n <= TOTAL; n++) if(n !== answer) pool.push(n);
    return shuffle(pool).slice(0, howMany);
  }

  function speakPrompt(){
    playClip('find-' + target, 'Find the number ' + WORDS[target]);
  }

  function newRound(){
    busy = false;
    field.classList.remove('locked');
    field.innerHTML = '';
    target = level;

    prompt.innerHTML = 'Find the <em>' + target + '</em>';
    prompt.classList.add('pulse');
    setTimeout(function(){ prompt.classList.remove('pulse'); }, 320);

    var count = choiceCount(level);
    var values = shuffle([target].concat(pickDecoys(target, count - 1)));
    var xs = slotsFor(count);
    var size = count <= 2 ? 'clamp(88px,26vw,190px)'
             : count === 3 ? 'clamp(72px,21vw,155px)'
             : 'clamp(58px,17vw,128px)';

    values.forEach(function(val, i){
      var b = document.createElement('button');
      b.className = 'num';
      b.type = 'button';
      b.textContent = val;
      b.setAttribute('aria-label', WORDS[val]);
      b.style.setProperty('--size', size);
      b.style.left = xs[i] + '%';
      b.style.top = (26 + Math.random() * 42) + '%';
      b.style.setProperty('--dur', (2.6 + Math.random() * 1.8).toFixed(2) + 's');
      b.style.setProperty('--delay', (Math.random() * 1.4).toFixed(2) + 's');
      b.style.setProperty('--tilt', (Math.random() * 8 - 4).toFixed(1) + 'deg');
      b.addEventListener('click', function(){ answer(val, b); });
      field.appendChild(b);
    });

    setTimeout(speakPrompt, 340);
  }

  /* ----- answering ----- */

  function react(mood){
    [teacher, chispa].forEach(function(node, i){
      if(!node || node.hidden) return;
      node.classList.remove('cheer','nudge');
      void node.offsetWidth;
      setTimeout(function(){ node.classList.add(mood); }, i * 110);
    });
  }

  function sparkle(el){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var box = el.getBoundingClientRect();
    var host = field.getBoundingClientRect();
    var cx = box.left - host.left + box.width / 2;
    var cy = box.top - host.top + box.height / 2;
    for(var i = 0; i < 16; i++){
      var s = document.createElement('span');
      var ang = (Math.PI * 2 / 16) * i + Math.random() * 0.4;
      var dist = 70 + Math.random() * 90;
      s.className = 'spark';
      s.style.left = cx + 'px';
      s.style.top = cy + 'px';
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      field.appendChild(s);
      setTimeout(function(node){ return function(){ node.remove(); }; }(s), 800);
    }
  }

  function answer(value, el){
    if(busy) return;

    if(value !== target){
      thud();
      el.classList.add('wrong','faded');
      react('nudge');
      setTimeout(function(){ el.classList.remove('wrong'); }, 520);
      setTimeout(function(){ say('That is ' + WORDS[value] + '. Try again!'); }, 260);
      return;
    }

    busy = true;
    field.classList.add('locked');
    chime();
    sparkle(el);
    el.classList.add('correct');
    lightGems(gemRow, level);

    react('cheer');

    var cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    prompt.innerHTML = '<em>' + target + '</em> — ' + cheer;
    setTimeout(function(){
      var key = randomCheerKey();
      if(key) playClip(key, null);
      else say(WORDS[target] + '. ' + cheer);
    }, 280);

    setTimeout(function(){
      if(level >= TOTAL){ finish(); }
      else { level++; newRound(); }
    }, 1750);
  }

  function finish(){
    lightGems(trophy, TOTAL);
    winVeil.hidden = false;
    setTimeout(function(){ playClip('win', 'You found all ten! Amazing.'); }, 450);
    setTimeout(toTitleMusic, 1400);
  }

  /* ----- wiring ----- */

  document.getElementById('again').addEventListener('click', function(){
    if(!busy) speakPrompt();
  });

  document.getElementById('mute').addEventListener('click', function(){
    setMuted(!muted);
  });

  document.getElementById('startBtn').addEventListener('click', function(){
    titleVeil.hidden = true;
    toGameMusic();
    level = 1;
    buildGems(gemRow);
    newRound();
  });

  document.getElementById('againBtn').addEventListener('click', function(){
    winVeil.hidden = true;
    toGameMusic();
    level = 1;
    buildGems(gemRow);
    newRound();
  });

  buildGems(gemRow);
  buildGems(trophy);
})();
</script>
</body>
</html>
