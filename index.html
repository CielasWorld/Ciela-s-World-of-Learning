<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ciela's World of Learning</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E7C86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ciela's World">
<link rel="apple-touch-icon" href="appIcon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#8FD8EA;
  --horizon:#F7E3B6;
  --teal:#0E7C86;
  --teal-deep:#0A5A62;
  --gold:#E8B75A;
  --gold-light:#FBE39B;
  --navy:#153349;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}

body{
  font-family:'Nunito',system-ui,sans-serif;
  background:linear-gradient(180deg,var(--sky) 0%,#BFE7E4 45%,var(--horizon) 100%);
  color:var(--navy);
  user-select:none;-webkit-user-select:none;
}

/* ---------- stage ---------- */

.stage{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

.stage::before{
  content:'';position:absolute;inset:0;
  background-image:url('backgroundPlate.png');
  background-size:cover;background-position:center;
  opacity:0;transition:opacity .6s ease;z-index:0;
}
.stage.has-bg::before{opacity:1}

/* ---------- header ---------- */

.bar{
  position:relative;z-index:3;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) 14px 6px;
}

.bar-left{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.bar-right{display:flex;align-items:center;gap:9px;min-width:0}

.mark{height:clamp(26px,6vw,44px);width:auto;filter:drop-shadow(0 2px 6px rgba(10,60,70,.35))}
.mark[hidden]{display:none}

.chip{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  width:clamp(34px,8vw,44px);height:clamp(34px,8vw,44px);
  border:0;border-radius:50%;
  background:rgba(255,255,255,.8);
  box-shadow:0 3px 10px rgba(12,70,80,.28),inset 0 0 0 2px var(--gold);
  font-size:clamp(15px,3.8vw,20px);line-height:1;cursor:pointer;
  transition:transform .18s ease,opacity .18s ease;
}
.chip:hover,.chip:focus-visible{transform:scale(1.08)}
.chip:focus-visible{outline:3px solid #fff;outline-offset:3px}
.chip[aria-pressed="true"]{opacity:.55}

.gems{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0}

.gem{
  width:clamp(11px,2.8vw,18px);height:clamp(11px,2.8vw,18px);
  border-radius:3px;background:rgba(255,255,255,.28);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);
  transform:rotate(45deg);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .35s ease;
}
.gem.won{
  background:linear-gradient(140deg,var(--gold-light),var(--gold));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85),0 0 12px rgba(232,183,90,.75);
  transform:rotate(45deg) scale(1.12);
}

/* ---------- prompt ---------- */

.prompt{
  position:relative;z-index:3;align-self:center;
  display:flex;align-items:center;gap:10px;
  margin-top:2px;padding:8px 24px;border-radius:999px;
  background:rgba(255,255,255,.84);backdrop-filter:blur(6px);
  box-shadow:0 4px 18px rgba(12,70,80,.22),inset 0 0 0 2px rgba(232,183,90,.55);
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(16px,4.3vw,28px);line-height:1.15;white-space:nowrap;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.prompt:empty{display:none}
.prompt em{font-style:normal;color:var(--teal);font-weight:800}
.prompt.pulse{transform:scale(1.06)}
.prompt img{height:clamp(28px,7vw,46px);width:auto}

/* ---------- play field ---------- */

.field{position:relative;z-index:2;flex:1;min-height:0}

.pick{
  position:absolute;transform:translate(-50%,-50%);
  border:0;background:none;padding:6px;cursor:pointer;
  animation:drift var(--dur) ease-in-out var(--delay) infinite alternate;
  touch-action:manipulation;transition:opacity .25s ease;
  line-height:.86;
}
.pick:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:18px}

@keyframes drift{
  from{transform:translate(-50%,-50%) translateY(-9px) rotate(var(--tilt))}
  to  {transform:translate(-50%,-50%) translateY(11px) rotate(calc(var(--tilt) * -1))}
}

.glyph{
  font-family:'Baloo 2',cursive;font-weight:800;font-size:var(--size);
  color:transparent;
  background-image:linear-gradient(165deg,#FFFFFF 0%,#BFF0F4 26%,var(--teal) 62%,var(--teal-deep) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:clamp(2px,.7vw,4px) var(--gold);
  paint-order:stroke fill;
  filter:drop-shadow(0 6px 10px rgba(9,60,70,.4));
}

.pick svg{display:block;width:var(--size);height:var(--size);filter:drop-shadow(0 6px 10px rgba(9,60,70,.4))}
.pick img{display:block;width:var(--size);height:auto;filter:drop-shadow(0 6px 10px rgba(9,60,70,.4))}

.pick.correct{animation:pop .55s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(1)}
  45%{transform:translate(-50%,-50%) scale(1.34) rotate(4deg)}
  100%{transform:translate(-50%,-50%) scale(0) rotate(-10deg);opacity:0}
}

.pick.wrong{animation:wobble .5s ease}
@keyframes wobble{
  0%,100%{transform:translate(-50%,-50%) rotate(0)}
  20%{transform:translate(-50%,-50%) rotate(-9deg)}
  45%{transform:translate(-50%,-50%) rotate(8deg)}
  70%{transform:translate(-50%,-50%) rotate(-5deg)}
}
.pick.faded{opacity:.42}
.field.locked .pick{pointer-events:none}

/* ---------- counting layout ---------- */

.count-wrap{position:absolute;inset:0;display:flex;flex-direction:column;gap:4px;padding:4px 10px}

.count-tray{
  flex:1;min-height:0;
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
  gap:clamp(4px,1.6vw,16px);
}
.count-tray img{
  width:var(--item);height:auto;
  filter:drop-shadow(0 5px 9px rgba(9,60,70,.4));
  animation:bobble var(--dur) ease-in-out var(--delay) infinite alternate;
}
@keyframes bobble{
  from{transform:translateY(-5px) rotate(-2deg)}
  to{transform:translateY(6px) rotate(2deg)}
}

.count-row{
  flex:0 0 auto;
  display:flex;justify-content:center;align-items:center;
  gap:clamp(10px,4vw,34px);padding-bottom:4px;
}
.count-row .pick{position:static;transform:none;animation:none}
.count-row .pick.correct{animation:popStatic .55s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes popStatic{
  0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}
}
.count-row .pick.wrong{animation:wobbleStatic .5s ease}
@keyframes wobbleStatic{
  0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}
}

/* ---------- sparkles ---------- */

.spark{
  position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:2px;
  background:linear-gradient(140deg,#fff,var(--gold));
  transform:rotate(45deg);pointer-events:none;
  animation:fly .75s ease-out forwards;
}
@keyframes fly{
  0%{opacity:1;transform:rotate(45deg) translate(0,0) scale(1)}
  100%{opacity:0;transform:rotate(220deg) translate(var(--dx),var(--dy)) scale(.2)}
}

/* ---------- crew ---------- */

.crew{
  position:relative;z-index:3;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 12px max(8px,env(safe-area-inset-bottom));pointer-events:none;
}

.teacher{
  pointer-events:auto;position:relative;border:0;background:none;padding:0;
  cursor:pointer;line-height:0;transform-origin:bottom center;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.teacher:hover,.teacher:focus-visible{transform:scale(1.04)}
.teacher:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:22px}

.ciela{height:clamp(88px,22vh,210px);width:auto;filter:drop-shadow(0 8px 14px rgba(9,60,70,.35));display:block}
.ciela[hidden]{display:none}

.speaker{
  position:absolute;top:2px;right:-6px;
  display:flex;align-items:center;justify-content:center;
  width:clamp(28px,7vw,42px);height:clamp(28px,7vw,42px);border-radius:50%;
  background:rgba(255,255,255,.9);
  box-shadow:0 3px 10px rgba(12,70,80,.3),inset 0 0 0 2.5px var(--gold);
  font-size:clamp(13px,3.4vw,20px);line-height:1;
}

.pup{height:clamp(52px,13vh,112px);width:auto;filter:drop-shadow(0 6px 12px rgba(9,60,70,.32));transform-origin:bottom center}
.pup[hidden]{display:none}

.teacher.cheer,.pup.cheer{animation:hop .65s cubic-bezier(.34,1.56,.64,1) 2}
.teacher.nudge,.pup.nudge{animation:sway .5s ease}
@keyframes hop{
  0%,100%{transform:translateY(0) rotate(0)}
  40%{transform:translateY(-16px) rotate(-4deg)}
  70%{transform:translateY(-4px) rotate(3deg)}
}
@keyframes sway{
  0%,100%{transform:rotate(0)}35%{transform:rotate(-5deg)}70%{transform:rotate(4deg)}
}

/* ---------- overlays ---------- */

.veil{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(12px,3vh,26px);padding:20px;text-align:center;
  background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.5),rgba(14,124,134,.74));
  backdrop-filter:blur(3px);
  transition:opacity .45s ease,visibility .45s;
  overflow-y:auto;
}
.veil[hidden]{opacity:0;visibility:hidden;display:flex;pointer-events:none}
.veil.wake{z-index:12;cursor:pointer}

.veil-mark{width:min(60vw,320px);height:auto;filter:drop-shadow(0 6px 18px rgba(8,50,60,.45))}
.veil-mark[hidden]{display:none}

.veil h1{
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:clamp(26px,8vw,52px);color:#fff;
  text-shadow:0 3px 0 var(--teal-deep),0 8px 22px rgba(8,50,60,.5);line-height:1.05;
}
.veil p{
  font-size:clamp(14px,4vw,20px);font-weight:700;color:#fff;
  text-shadow:0 2px 8px rgba(8,50,60,.6);max-width:24ch;
}

.tap-hint{
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(17px,4.8vw,26px);color:#fff;
  text-shadow:0 2px 10px rgba(8,50,60,.7);
  animation:breathe 2.2s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:.65;transform:scale(1)}
  50%{opacity:1;transform:scale(1.05)}
}

.tiles{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(clamp(104px,25vw,150px),1fr));
  gap:clamp(9px,2.4vw,18px);
  width:min(94vw,700px);
}

.tile{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:clamp(11px,2.6vw,18px) 8px clamp(9px,2vw,14px);
  border:0;border-radius:22px;cursor:pointer;
  background:rgba(255,255,255,.9);
  box-shadow:0 5px 0 rgba(11,90,98,.55),0 12px 24px rgba(8,50,60,.32),inset 0 0 0 2.5px var(--gold);
  transition:transform .18s ease,box-shadow .18s ease;
}
.tile:hover,.tile:focus-visible{transform:translateY(-3px)}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(11,90,98,.55),0 5px 12px rgba(8,50,60,.32),inset 0 0 0 2.5px var(--gold)}
.tile:focus-visible{outline:4px solid #fff;outline-offset:4px}

.tile img{width:clamp(44px,11vw,72px);height:auto}
.tile .glyphicon{
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:clamp(32px,8vw,54px);color:var(--teal);line-height:1;
}
.tile span{
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(14px,3.4vw,20px);color:var(--navy);line-height:1.1;
}

.tile .tally{
  font-family:'Nunito',sans-serif;font-weight:700;
  font-size:clamp(10px,2.4vw,13px);
  color:var(--teal);opacity:.75;letter-spacing:.02em;
}

.grownups{
  margin-top:4px;border:0;background:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-weight:700;
  font-size:clamp(12px,3vw,15px);color:#fff;opacity:.75;
  text-shadow:0 2px 8px rgba(8,50,60,.6);
  padding:8px 14px;border-radius:999px;
}
.grownups:hover,.grownups:focus-visible{opacity:1}
.grownups:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* ---------- parent report ---------- */

.veil.report{justify-content:flex-start;padding-top:max(24px,env(safe-area-inset-top))}

.report-body{
  width:min(94vw,640px);
  display:flex;flex-direction:column;gap:14px;
  background:rgba(255,255,255,.93);
  border-radius:22px;padding:16px 18px;
  box-shadow:0 12px 30px rgba(8,50,60,.4),inset 0 0 0 2.5px var(--gold);
  text-align:left;
}

.report-mode h2{
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(15px,3.8vw,20px);color:var(--navy);
  margin-bottom:6px;
}
.report-mode .none{font-size:13px;font-weight:600;color:#6a7f8c}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.chipitem{
  display:flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:999px;
  font-family:'Nunito',sans-serif;font-weight:800;
  font-size:clamp(11px,2.8vw,14px);
  background:#E7EDF0;color:#6a7f8c;
  box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.06);
}
.chipitem .n{font-size:.85em;font-weight:700;opacity:.85}
.chipitem.solid{background:#D6F2E2;color:#1d7a4d;box-shadow:inset 0 0 0 1.5px #7fd1a6}
.chipitem.shaky{background:#FBE6C8;color:#8a5a10;box-shadow:inset 0 0 0 1.5px #e8b75a}
.chipitem.hard{background:#F9D9D4;color:#96382b;box-shadow:inset 0 0 0 1.5px #e8705a}

.legend{
  display:flex;flex-wrap:wrap;gap:10px;
  font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;color:#5b6f7c;
  padding-top:2px;
}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.go.danger{color:#8f3326}

.veil.report p.note{
  color:#fff;font-size:13px;font-weight:600;max-width:44ch;
  text-shadow:0 2px 8px rgba(8,50,60,.6);
}

.go{
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:clamp(18px,4.8vw,28px);color:var(--navy);
  background:linear-gradient(165deg,var(--gold-light),var(--gold));
  border:0;border-radius:999px;
  padding:clamp(11px,2.4vh,17px) clamp(28px,7vw,52px);cursor:pointer;
  box-shadow:0 6px 0 #B98A32,0 12px 26px rgba(8,50,60,.4);
  transition:transform .16s ease,box-shadow .16s ease;
}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 #B98A32,0 5px 14px rgba(8,50,60,.4)}
.go:focus-visible{outline:4px solid #fff;outline-offset:4px}

.go.ghost{
  background:rgba(255,255,255,.85);
  box-shadow:0 5px 0 rgba(11,90,98,.5),0 10px 20px rgba(8,50,60,.35);
  font-size:clamp(15px,4vw,21px);
  padding:clamp(9px,2vh,14px) clamp(22px,6vw,40px);
}
.go.ghost:active{box-shadow:0 1px 0 rgba(11,90,98,.5),0 4px 10px rgba(8,50,60,.35)}

.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.trophy{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:300px}
.trophy .gem{width:24px;height:24px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <header class="bar">
    <div class="bar-left">
      <button class="chip" id="home" aria-label="Back to the games">&#127968;</button>
      <img class="mark" id="mark" src="cielaWorldLogo.png" alt="Ciela's World of Learning">
    </div>
    <div class="bar-right">
      <div class="gems" id="gems" aria-label="Gems collected"></div>
      <button class="chip" id="mute" aria-label="Turn sound off" aria-pressed="false">&#128266;</button>
    </div>
  </header>

  <p class="prompt" id="prompt"></p>

  <div class="field" id="field" role="group" aria-label="Choices"></div>

  <div class="crew">
    <button class="teacher" id="again" aria-label="Ask Ciela to say it again">
      <img class="ciela" id="ciela" src="cielaBust.png" alt="Ciela">
      <span class="speaker" aria-hidden="true">&#128266;</span>
    </button>
    <img class="pup" id="chispa" src="Chispa-head-icon-250.png" alt="">
  </div>
</div>

<div class="veil wake" id="wakeVeil">
  <img class="veil-mark" id="wakeMark" src="cielaWorldLogo.png" alt="Ciela's World of Learning">
  <p class="tap-hint">Tap anywhere to begin</p>
</div>

<div class="veil" id="homeVeil" hidden>
  <img class="veil-mark" id="homeMark" src="cielaWorldLogo.png" alt="Ciela's World of Learning">
  <p>Pick a game to play with Ciela.</p>
  <div class="tiles" id="tiles"></div>
  <button class="grownups" id="grownupsBtn">For grown-ups</button>
</div>

<div class="veil" id="gateVeil" hidden>
  <h1>Grown-ups only</h1>
  <p id="gateQuestion">Tap the answer</p>
  <div class="row" id="gateOptions"></div>
  <button class="go ghost" id="gateCancel">Never mind</button>
</div>

<div class="veil report" id="reportVeil" hidden>
  <h1>Progress</h1>
  <div class="report-body" id="reportBody"></div>
  <div class="row">
    <button class="go ghost" id="reportClose">Done</button>
    <button class="go ghost danger" id="reportReset">Start over</button>
  </div>
</div>

<div class="veil" id="winVeil" hidden>
  <h1 id="winTitle">You did it!</h1>
  <div class="trophy" id="trophy"></div>
  <div class="row">
    <button class="go" id="againBtn">Play again</button>
    <button class="go ghost" id="backBtn">Other games</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ==========================================================
     Content
     ========================================================== */

  var WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
  var CHEERS = ['Great job!','You got it!','Nice tapping!','Well done!','That is the one!'];
  var ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  /* Letters whose initial sound is unambiguous in this prop set.
     Deliberately left out:
       A E I O U - vowel sounds can't be voiced without naming a word,
                   and naming the word gives the answer away
       C         - canteen says /k/, which collides with key
       G         - "magnifying glass" starts with an m sound, not a g
       Q         - quill is a /kw/ blend, not a single sound
       X         - xylophone actually starts with a z sound (the classic trap) */
  var SOUND_LETTERS = 'BDFHJKLMNPRSTVWYZ'.split('');

  /* How each sound is spelled out for the voice line and the fallback. */
  var SOUND_SAY = {
    B:'buh', D:'duh', F:'ffff', H:'huh', J:'juh', K:'kuh', L:'llll',
    M:'mmmm', N:'nnnn', P:'puh', R:'rrrr', S:'ssss', T:'tuh',
    V:'vvvv', W:'wuh', Y:'yuh', Z:'zzzz'
  };

  /* Prop art already in the repo. `many` drives the counting prompts (always
     plural — "How many lanterns?" reads naturally even when there is one),
     `letter` drives the alphabet clues, `key` names the audio clip. */
  var PROPS = [
    { key:'apple',     file:'apple-transparent.png',                     one:'apple',            many:'apples',             letter:'A' },
    { key:'box',       file:'crystal-specimen-box-transparent.png',      one:'box',              many:'boxes',              letter:'B' },
    { key:'canteen',   file:'explorer-canteen-transparent.png',          one:'canteen',          many:'canteens',           letter:'C' },
    { key:'drum',      file:'drum-transparent.png',                      one:'drum',             many:'drums',              letter:'D' },
    { key:'egg',       file:'egg-transparent.png',                       one:'egg',              many:'eggs',               letter:'E' },
    { key:'flower',    file:'flower-transparent.png',                    one:'flower',           many:'flowers',            letter:'F' },
    { key:'magnifier', file:'discovery-magnifier-transparent.png',       one:'magnifying glass', many:'magnifying glasses', letter:'G' },
    { key:'hat',       file:'hat-transparent.png',                       one:'hat',              many:'hats',               letter:'H' },

  function tone(freqs, type, peak){
    if(muted) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      freqs.forEach(function(f, i){
        var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        var t0 = audioCtx.currentTime + i * 0.09;
        osc.type = type; osc.frequency.value = f;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + 0.36);
      });
    }catch(e){}
  }

  /* Filenames don't follow one convention, so probe a few spellings with a
     HEAD request. Higgsfield exports .wav, hand-added files are .mp3 — both
     are checked. Media events can't be trusted here: phone browsers often
     refuse to preload audio, so canplaythrough may never fire. */
  function candidates(stem){
    return [
      stem + '.mp3',
      stem + '.wav',
      'audio' + stem + '.mp3',
      'audio' + stem + '.wav',
      'audio/' + stem + '.mp3',
      'audio/' + stem + '.wav'
    ];
  }

  function findFile(stem, done){
    var names = candidates(stem), i = 0;
    (function next(){
      if(i >= names.length){ audioReport.push(stem + ': -'); done(null); return; }
      fetch(names[i], { method:'HEAD', cache:'no-store' })
        .then(function(r){
          if(r.ok){ audioReport.push(stem + ' -> ' + names[i]); done(names[i]); }
          else { i++; next(); }
        })
        .catch(function(){ i++; next(); });
    })();
  }

      var voices = window.speechSynthesis.getVoices();

      var warm = en.filter(function(v){ return /female|samantha|zira|karen|moira|tessa|aria/i.test(v.name); });

  /* ==========================================================
     Adaptive round planning

     A child who already knows 1-10 shouldn't sit through all ten
     every time. Once there is history for a mode, rounds are drawn
     toward the items they miss, with mastered items still appearing
     often enough to keep it winnable. With no history yet, the mode's
     natural teaching order is used instead.
     ========================================================== */

  function keyOfItem(mKey, item){
    if(mKey === 'letters')   return item.letter;
    if(mKey === 'lowercase') return item.letter.toLowerCase();
    if(mKey === 'sounds')    return item.letter;
    if(item && typeof item === 'object') return item.key;
    return String(item);
  }

  function weightOf(mKey, item){
    var slot = (progress[mKey] || {})[keyOfItem(mKey, item)];
    if(!slot) return 4;                       /* never seen - introduce it */
    if(slot.wrong > slot.right) return 6;     /* getting it wrong a lot    */
    if(slot.wrong > 0) return 3;              /* shaky                     */
    if(slot.right >= 3) return 1;             /* solid - keep it rare      */
    return 2;                                 /* right, but not yet proven */
  }

  function weightedPick(mKey, pool, avoid){
    var weights = [], total = 0;
    pool.forEach(function(item){
      var w = (item === avoid) ? 0 : weightOf(mKey, item);
      weights.push(w);
      total += w;
    });
    if(total <= 0) return pool[Math.floor(Math.random() * pool.length)];
    var roll = Math.random() * total, acc = 0;
    for(var i = 0; i < pool.length; i++){
      acc += weights[i];
      if(roll <= acc) return pool[i];
    }
    return pool[pool.length - 1];
  }

  function adaptivePlan(mKey, pool, count, keepOrder){
    var seen = progress[mKey] || {};
    var hasHistory = Object.keys(seen).length > 0;

    if(!hasHistory){
      var fresh = pool.slice();
      if(!keepOrder) shuffle(fresh);
      return fresh.slice(0, count);
    }

    /* anything never seen goes in first, so new material still arrives */
    var unseen = pool.filter(function(it){ return !seen[keyOfItem(mKey, it)]; });
    shuffle(unseen);
    var picks = unseen.slice(0, Math.ceil(count / 2));

    var last = picks.length ? picks[picks.length - 1] : null;
    var guard = 0;
    while(picks.length < count && guard++ < 300){
      var choice = weightedPick(mKey, pool, last);
      picks.push(choice);
      last = choice;
    }

    shuffle(picks);

    /* no item twice in a row - a repeat reads as a glitch to a small child */
    for(var i = 1; i < picks.length; i++){
      if(picks[i] === picks[i - 1]){
        for(var j = i + 1; j < picks.length; j++){
          if(picks[j] !== picks[i - 1]){
            var t = picks[i]; picks[i] = picks[j]; picks[j] = t;
            break;
          }
        }
      }
    }
    return picks;
  }

        return shuffle([target].concat(sample(COLORS, count - 1, target)));
      },
      prompt: function(target){ return 'Find <em>' + target.name + '</em>'; },
      speak: function(target){ return ['color-' + target.key, 'Find the color ' + target.name]; },
      render: function(value){
        var b = document.createElement('button');
        b.className = 'pick';
        b.type = 'button';
        b.innerHTML = shapeSVG('circle', value.hex);
        b.setAttribute('aria-label', value.name);
        return b;
      },
      same: function(a, b){ return a.key === b.key; }
    },

    letters: {
      label: 'Letters',
      icon: 'magical-quill-and-inkwell-transparent.png',
      done: 'You found all the letters!',
      plan: function(){ return adaptivePlan('letters', PROPS.slice(), 10, false); },
      answer: function(target){ return target.letter; },
      itemKey: function(target){ return target.letter; },
      choices: function(target, round){
        var count = round <= 3 ? 2 : round <= 6 ? 3 : 4;
        return shuffle([target.letter].concat(sample(ALPHABET, count - 1, target.letter)));
      },
      prompt: function(target){
        return '<img src="' + target.file + '" alt="" onerror="this.remove()">' +
               '<span><em>' + target.letter + '</em> is for ' + target.one + '</span>';
      },
      speak: function(target){
        return ['letter-' + target.letter,
                target.letter + ' is for ' + target.one + '. Find the ' + target.letter + '.'];
      },
      render: function(value){ return glyphButton(value, 'letter ' + value); }
    },

    /* Lowercase is what a child actually meets in books and on signs.
       The letter's NAME is the same, so the recorded lines are reused
       as-is: hearing "A is for apple" while looking at a lowercase a
       is exactly the association being taught. */
    lowercase: {
      label: 'Small Letters',
      icon: 'paintbrush-transparent.png',
      done: 'You found all the small letters!',
      plan: function(){ return adaptivePlan('lowercase', PROPS.slice(), 10, false); },
      answer: function(target){ return target.letter.toLowerCase(); },
      itemKey: function(target){ return target.letter.toLowerCase(); },
      choices: function(target, round){
        var count = round <= 3 ? 2 : round <= 6 ? 3 : 4;
        var small = target.letter.toLowerCase();
        var pool = ALPHABET.map(function(L){ return L.toLowerCase(); });
        return shuffle([small].concat(sample(pool, count - 1, small)));
      },
      prompt: function(target){
        return '<img src="' + target.file + '" alt="" onerror="this.remove()">' +
               '<span><em>' + target.letter.toLowerCase() + '</em> is for ' + target.one + '</span>';
      },
      speak: function(target){
        return ['letter-' + target.letter,
                target.letter + ' is for ' + target.one + '. Find the small ' + target.letter + '.'];
      },
      render: function(value){ return glyphButton(value, 'small letter ' + value); }
    },

    /* Initial-sound isolation: Ciela says a sound, the child picks the
       picture that starts with it. No letter is shown, on purpose —
       the whole task is listening. */
    sounds: {
      label: 'Sounds',
      icon: 'bird-signal-whistle-transparent.png',
      done: 'You heard every sound!',
      plan: function(){ return adaptivePlan('sounds', soundProps(), 10, false); },
      itemKey: function(target){ return target.letter; },
      choices: function(target, round){
        var count = round <= 3 ? 2 : round <= 6 ? 3 : 4;
        return shuffle([target].concat(sample(soundProps(), count - 1, target)));
      },
      prompt: function(){
        return '<span>Which one starts with this sound?</span>';
      },
      speak: function(target){
        var say = SOUND_SAY[target.letter] || target.letter;
        return ['sound-' + target.letter,
                say + '. Which one starts with ' + say + '?'];
      },
      render: function(value){
        var b = document.createElement('button');
        b.className = 'pick';
        b.type = 'button';
        var img = document.createElement('img');
        img.src = value.file;
        img.alt = '';
        b.appendChild(img);
        b.setAttribute('aria-label', value.one);
        return b;
      },
      same: function(a, b){ return a.letter === b.letter; }
    }
  };

  /* ==========================================================
     Round engine
     ========================================================== */

  function currentTarget(){ return rounds[index]; }

  function answerValue(){
    return mode.answer ? mode.answer.call(mode, currentTarget()) : currentTarget();
  }

  function matches(a, b){
    return mode.same ? mode.same.call(mode, a, b) : a === b;
  }

  function newRound(){
    busy = false;
    field.classList.remove('locked');
    field.innerHTML = '';

    var target = currentTarget();
    if(mode.before) mode.before.call(mode, target);

    prompt.innerHTML = mode.prompt.call(mode, target);
    prompt.classList.add('pulse');
    setTimeout(function(){ prompt.classList.remove('pulse'); }, 320);

    var options = mode.choices.call(mode, target, index + 1);

    if(mode.layout === 'count') renderCounting(target, options);
    else renderFloating(options);

    setTimeout(speakPrompt, 340);
  }

  function renderFloating(options){
    options.forEach(function(value, i){
      var b = mode.render.call(mode, value);
      floatify(b, i, options.length);
      b.addEventListener('click', function(){ judge(value, b); });
      field.appendChild(b);
    });
  }

  function renderCounting(target, options){
    var wrap = document.createElement('div');
    wrap.className = 'count-wrap';

    var tray = document.createElement('div');
    tray.className = 'count-tray';
    var itemSize = target <= 4 ? 'clamp(52px,15vw,120px)'
                 : target <= 6 ? 'clamp(44px,12vw,96px)'
                 : 'clamp(36px,10vw,78px)';

    for(var k = 0; k < target; k++){
      var img = document.createElement('img');
      img.src = mode.prop.file;
      img.alt = '';
      img.style.setProperty('--item', itemSize);
      img.style.setProperty('--dur', (2.4 + Math.random() * 1.6).toFixed(2) + 's');
      img.style.setProperty('--delay', (Math.random() * 1.2).toFixed(2) + 's');
      tray.appendChild(img);
    }

    var row = document.createElement('div');
    row.className = 'count-row';
    options.forEach(function(value){
      var b = mode.render.call(mode, value);
      b.style.setProperty('--size', 'clamp(52px,15vw,116px)');
      b.addEventListener('click', function(){ judge(value, b); });
      row.appendChild(b);
    });

    wrap.appendChild(tray);
    wrap.appendChild(row);
    field.appendChild(wrap);
  }

  function speakPrompt(){
    if(!mode || !rounds.length) return;
    var pair = mode.speak.call(mode, currentTarget());
    if(pair[0]) playClip(pair[0], pair[1]);
    else say(pair[1]);
  }

  function react(mood){
    [teacher, chispa].forEach(function(node, i){
      if(!node || node.hidden) return;
      node.classList.remove('cheer','nudge');
      void node.offsetWidth;
      setTimeout(function(){ node.classList.add(mood); }, i * 110);
    });
  }

  function sparkle(el){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var box = el.getBoundingClientRect(), host = field.getBoundingClientRect();
    var cx = box.left - host.left + box.width / 2;
    var cy = box.top - host.top + box.height / 2;
    for(var i = 0; i < 16; i++){
      var s = document.createElement('span');
      var ang = (Math.PI * 2 / 16) * i + Math.random() * 0.4;
      var dist = 70 + Math.random() * 90;
      s.className = 'spark';
      s.style.left = cx + 'px';
      s.style.top = cy + 'px';
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      field.appendChild(s);
      (function(node){ setTimeout(function(){ node.remove(); }, 800); })(s);
    }
  }

  function currentItemKey(){
    var t = currentTarget();
    if(t === undefined || t === null) return null;
    if(mode.itemKey) return mode.itemKey.call(mode, t);
    if(typeof t === 'object') return t.key || t.letter || null;
    return String(t);
  }

  function judge(value, el){
    if(busy) return;

    if(!matches(value, answerValue())){
      record(modeKey, currentItemKey(), false);
      thud();
      el.classList.add('wrong','faded');
      react('nudge');
      setTimeout(function(){ el.classList.remove('wrong'); }, 520);
      setTimeout(speakPrompt, 950);
      return;
    }

    record(modeKey, currentItemKey(), true);
    busy = true;
    field.classList.add('locked');
    chime();
    sparkle(el);
    el.classList.add('correct');
    lightGems(gemRow, index + 1);
    react('cheer');

    var cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    prompt.innerHTML = cheer;

    setTimeout(function(){
      var key = randomCheerKey();
      if(key) playClip(key, null);
      else say(cheer);
    }, 280);

    setTimeout(function(){
      index++;
      if(index >= rounds.length) finish();
      else newRound();
    }, 1750);
  }

  function finish(){
    winTitle.textContent = mode.done;
    buildGems(trophy, rounds.length);
    lightGems(trophy, rounds.length);
    winVeil.hidden = false;
    setTimeout(function(){ playClip('win', mode.done); }, 450);
    setTimeout(toMenuMusic, 1400);
  }

  /* ==========================================================
     Screens
     ========================================================== */

  function startMode(key){
    modeKey = key;
    mode = MODES[key];
    rounds = mode.plan.call(mode);
    index = 0;
    buildGems(gemRow, rounds.length);
    homeVeil.hidden = true;
    winVeil.hidden = true;
    toGameMusic();
    newRound();
  }

  function goHome(){
    field.innerHTML = '';
    prompt.innerHTML = '';
    mode = null;
    rounds = [];
    busy = false;
    winVeil.hidden = true;
    homeVeil.hidden = false;
    buildGems(gemRow, 0);
    buildTiles();
    try{ window.speechSynthesis.cancel(); }catch(e){}
    toMenuMusic();
  }

  /* ==========================================================
     Grown-ups: gate + progress report
     ========================================================== */

  var gateVeil    = document.getElementById('gateVeil');
  var gateQuestion= document.getElementById('gateQuestion');
  var gateOptions = document.getElementById('gateOptions');
  var reportVeil  = document.getElementById('reportVeil');
  var reportBody  = document.getElementById('reportBody');

  function openGate(){
    var a = 3 + Math.floor(Math.random() * 7);   /* 3-9  */
    var b = 4 + Math.floor(Math.random() * 6);   /* 4-9  */
    var answer = a * b;
    gateQuestion.textContent = 'What is ' + a + ' \u00d7 ' + b + '?';

    var choices = [answer];
    while(choices.length < 3){
      var off = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 9));
      var wrong = answer + off;
      if(wrong > 0 && choices.indexOf(wrong) === -1) choices.push(wrong);
    }
    shuffle(choices);

    gateOptions.innerHTML = '';
    choices.forEach(function(n){
      var b2 = document.createElement('button');
      b2.className = 'go ghost';
      b2.type = 'button';
      b2.textContent = n;
      b2.addEventListener('click', function(){
        if(n === answer){ gateVeil.hidden = true; openReport(); }
        else openGate();
      });
      gateOptions.appendChild(b2);
    });

    homeVeil.hidden = true;
    gateVeil.hidden = false;
  }

  function bandFor(slot){
    if(!slot || (slot.right + slot.wrong) === 0) return '';
    if(slot.wrong === 0) return 'solid';
    if(slot.right > slot.wrong) return 'shaky';
    return 'hard';
  }

  function openReport(){
    reportBody.innerHTML = '';
    var anyData = false;

    Object.keys(MODES).forEach(function(key){
      var section = document.createElement('div');
      section.className = 'report-mode';

      var h = document.createElement('h2');
      var met = metCount(key), total = itemsFor(key).length;
      h.textContent = MODES[key].label + ' \u2014 ' + met + ' of ' + total;
      section.appendChild(h);

      var seen = progress[key] || {};
      var touched = itemsFor(key).filter(function(id){ return seen[id]; });

      if(!touched.length){
        var none = document.createElement('p');
        none.className = 'none';
        none.textContent = 'Not played yet.';
        section.appendChild(none);
      }else{
        anyData = true;
        var wrap = document.createElement('div');
        wrap.className = 'chips';
        itemsFor(key).forEach(function(id){
          var slot = seen[id];
          var chip = document.createElement('span');
          chip.className = 'chipitem ' + bandFor(slot);
          chip.appendChild(document.createTextNode(itemLabel(key, id)));
          if(slot){
            var n = document.createElement('span');
            n.className = 'n';
            n.textContent = slot.right + '\u2713 ' + slot.wrong + '\u2717';
            chip.appendChild(n);
          }
          wrap.appendChild(chip);
        });
        section.appendChild(wrap);
      }
      reportBody.appendChild(section);
    });

    var legend = document.createElement('div');
    legend.className = 'legend';
    legend.innerHTML =
      '<span><i style="background:#D6F2E2;box-shadow:inset 0 0 0 1.5px #7fd1a6"></i>always right</span>' +
      '<span><i style="background:#FBE6C8;box-shadow:inset 0 0 0 1.5px #e8b75a"></i>mostly right</span>' +
      '<span><i style="background:#F9D9D4;box-shadow:inset 0 0 0 1.5px #e8705a"></i>needs practice</span>' +
      '<span><i style="background:#E7EDF0"></i>not seen yet</span>';
    reportBody.appendChild(legend);

    if(!anyData){
      var note = document.createElement('p');
      note.className = 'none';
      note.textContent = 'Play a game and results will show up here.';
      reportBody.appendChild(note);
    }

    reportVeil.hidden = false;
  }

  document.getElementById('grownupsBtn').addEventListener('click', openGate);

  document.getElementById('gateCancel').addEventListener('click', function(){
    gateVeil.hidden = true;
    homeVeil.hidden = false;
  });

  document.getElementById('reportClose').addEventListener('click', function(){
    reportVeil.hidden = true;
    homeVeil.hidden = false;
    buildTiles();
  });

  var resetArmed = false;
  document.getElementById('reportReset').addEventListener('click', function(){
    var btn = this;
    if(!resetArmed){
      resetArmed = true;
      btn.textContent = 'Tap again to erase';
      setTimeout(function(){
        resetArmed = false;
        btn.textContent = 'Start over';
      }, 4000);
      return;
    }
    clearProgress();
    resetArmed = false;
    btn.textContent = 'Start over';
    openReport();
    buildTiles();
  });

  function buildTiles(){
    tiles.innerHTML = '';
    Object.keys(MODES).forEach(function(key){
      var m = MODES[key];
      var b = document.createElement('button');
      b.className = 'tile';
      b.type = 'button';

      var img = document.createElement('img');
      img.src = m.icon;
      img.alt = '';
      img.addEventListener('error', function(){
        var span = document.createElement('span');
        span.className = 'glyphicon';
        span.textContent = m.label.charAt(0);
        img.replaceWith(span);
      });
      b.appendChild(img);

      var label = document.createElement('span');
      label.textContent = m.label;
      b.appendChild(label);

      var total = itemsFor(key).length;
      var met = metCount(key);
      if(met > 0){
        var tally = document.createElement('span');
        tally.className = 'tally';
        tally.textContent = met + ' of ' + total;
        b.appendChild(tally);
      }

      b.addEventListener('click', function(){ startMode(key); });
      tiles.appendChild(b);
    });
  }

  /* ==========================================================
     Wiring
     ========================================================== */

  wakeVeil.addEventListener('click', function(){
    wakeVeil.hidden = true;
    homeVeil.hidden = false;
    if(!muted && titleOk){
      titleMusic.volume = 0.5;
      titleMusic.play().catch(function(){});
    }
  });

  document.getElementById('home').addEventListener('click', goHome);

  document.getElementById('mute').addEventListener('click', function(){
    setMuted(!muted);
  });

  teacher.addEventListener('click', function(){
    if(!busy) speakPrompt();
  });

  document.getElementById('againBtn').addEventListener('click', function(){
    if(modeKey) startMode(modeKey);
  });

  document.getElementById('backBtn').addEventListener('click', goHome);

  buildTiles();
  buildGems(gemRow, 0);

  /* ?debug on the URL lists which audio files were found */
  if(location.search.indexOf('debug') > -1){
    setTimeout(function(){
      var box = document.createElement('pre');
      box.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99;max-height:45vh;overflow:auto;margin:0;padding:8px;font:11px monospace;background:rgba(0,0,0,.85);color:#8f8;white-space:pre-wrap';
      box.textContent = audioReport.sort().join('\n');
      document.body.appendChild(box);
    }, 4000);
  }
})();
</script>
</body>
</html>
