name: Upload signed iPhone build to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ios-offline-development]
    paths: ['ios-app/release/upload-request.txt']

permissions:
  contents: read
  actions: read

concurrency:
  group: ciela-testflight-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/ios-offline-development'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require approved upload credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$ASC_KEY_ID" || { echo 'Missing upload key ID'; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo 'Missing upload issuer ID'; exit 1; }
          test -n "$ASC_PRIVATE_KEY_BASE64" || { echo 'Missing upload private key'; exit 1; }
      - name: Download verified signed build 4
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13324623620'
          run-id: '41835179594'
          github-token: ${{ github.token }}
          path: signed-package
          merge-multiple: true
      - name: Check app identity
        run: |
          python3 - <<'PY'
          import pathlib, plistlib, zipfile
          packages = list(pathlib.Path('signed-package').glob('*.ipa'))
          if len(packages) != 1:
              raise SystemExit('Expected exactly one signed IPA')
          with zipfile.ZipFile(packages[0]) as archive:
              info = plistlib.loads(archive.read('Payload/App.app/Info.plist'))
          if info.get('CFBundleIdentifier') != 'org.cielasworld.learning':
              raise SystemExit('Wrong app bundle')
          if info.get('CFBundleShortVersionString') != '1.0' or str(info.get('CFBundleVersion')) != '4':
              raise SystemExit('Wrong version or build number')
          print('Verified Ciela app version 1.0, build 4')
          PY
      - name: Validate and upload to Apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$ASC_KEY_ID" =~ ^[A-Za-z0-9]+$ ]] || { echo 'Invalid upload key ID'; exit 1; }
          mkdir -p private_keys
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA_PATH=$(find signed-package -name '*.ipa' -print -quit)
          xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove temporary upload credentials
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [[ "$ASC_KEY_ID" =~ ^[A-Za-z0-9]+$ ]]; then
            rm -f "private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
