name: iOS release screenshots and activity checks

on:
  workflow_dispatch:
  push:
    branches: [ios-offline-development]
    paths:
      - '.github/workflows/ios-release-screenshots.yml'
      - 'ios-app/scripts/configure-release-ui-tests.rb'
      - 'ios-app/release/ReleaseUITests.swift'

permissions:
  contents: read

jobs:
  release-screenshots:
    if: github.ref == 'refs/heads/ios-offline-development'
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare offline app and native UI checks
        run: |
          npm install
          npm run ios:prepare
          npx cap add ios
          npm run ios:sync
          gem install --user-install xcodeproj --no-document
          ruby scripts/configure-release-ui-tests.rb
      - name: Capture iPhone and iPad gameplay
        run: |
          set -euo pipefail
          mkdir -p build/release-screenshots
          for KIND in iPhone iPad; do
            DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; k=sys.argv[1]; ds=[d for runtime,devices in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith(k)]; ds.sort(key=lambda d: (not ("13-inch" in d["name"] or "Pro Max" in d["name"]), d["name"])); print(ds[0]["udid"])' "$KIND")
            xcodebuild -project ios/App/App.xcodeproj -scheme ReleaseScreenshots -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/ui-derived -resultBundlePath "build/$KIND.xcresult" CODE_SIGNING_ALLOWED=NO test
            xcrun xcresulttool export attachments --path "build/$KIND.xcresult" --output-path "build/release-screenshots/$KIND"
            xcrun simctl shutdown "$DEVICE_ID" || true
          done
      - name: Upload screenshots and native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cielas-World-AppStore-screenshots
          path: |
            ios-app/build/release-screenshots
            ios-app/build/*.xcresult
          if-no-files-found: error
          retention-days: 14
