name: Android test APK

on:
  push:
    branches: [android-offline-development]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    if: github.ref == 'refs/heads/android-offline-development'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Bundle local game files
        run: node scripts/prepare-web.mjs
      - name: Create Android project
        run: npx cap add android
      - name: Sync bundled assets
        run: npm run android:sync
      - name: Build test APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Cielas-World-Learning-test-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
