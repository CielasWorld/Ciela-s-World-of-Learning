name: iOS signed App Store build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-ios:
    if: github.ref == 'refs/heads/ios-offline-development'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - name: Require signing secrets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          test -n "$IOS_DISTRIBUTION_P12_BASE64" || { echo 'Missing iOS certificate secret'; exit 1; }
          test -n "$IOS_DISTRIBUTION_P12_PASSWORD" || { echo 'Missing iOS certificate password secret'; exit 1; }
          test -n "$IOS_APPSTORE_PROFILE_BASE64" || { echo 'Missing iOS provisioning profile secret'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create offline iOS project
        run: |
          npm install
          npm run ios:prepare
          npx cap add ios
          npm run ios:sync
      - name: Install project configuration tool
        run: gem install --user-install xcodeproj --no-document
      - name: Install temporary signing identity
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/ciela.p12"
          printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/ciela.mobileprovision"
          SIGNING_KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$SIGNING_KEYCHAIN_PASSWORD"
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ciela.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ciela.keychain-db"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ciela.keychain-db"
          security import "$RUNNER_TEMP/ciela.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -k "$RUNNER_TEMP/ciela.keychain-db" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ciela.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/ciela.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/ciela.mobileprovision" > "$RUNNER_TEMP/ciela-profile.plist"
          python3 scripts/configure-signing.py
          ruby scripts/configure-signing.rb
      - name: Archive signed iPhone app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Ciela.xcarchive" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
      - name: Export App Store package
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Ciela.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/CielaExportOptions.plist" -exportPath build/app-store
      - name: Verify exported signature
        run: |
          IPA_PATH=$(find build/app-store -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/ciela-verify"
          codesign --verify --deep --strict "$RUNNER_TEMP/ciela-verify/Payload/App.app"
      - name: Upload signed package for App Store Connect
        uses: actions/upload-artifact@v4
        with:
          name: Cielas-World-signed-AppStore-IPA
          path: ios-app/build/app-store/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ciela.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/08fd1ba8-b7ce-4181-ae04-fad6d638a4c4.mobileprovision"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/08fd1ba8-b7ce-4181-ae04-fad6d638a4c4.mobileprovision"
          rm -f "$RUNNER_TEMP/ciela.p12" "$RUNNER_TEMP/ciela.mobileprovision" "$RUNNER_TEMP/ciela-profile.plist"
